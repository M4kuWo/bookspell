<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookspell — Rate Books</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .rating-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .rating-btn { flex: 1 1 auto; padding: 10px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 600; font-size: 0.85rem; }
  .rating-btn.active.loved { background: var(--loved); color: #fff; border-color: var(--loved); }
  .rating-btn.active.liked { background: var(--liked); color: #fff; border-color: var(--liked); }
  .rating-btn.active.it_was_okay { background: var(--okay); color: #fff; border-color: var(--okay); }
  .rating-btn.active.disliked { background: var(--disliked); color: #fff; border-color: var(--disliked); }
  .rating-btn.active.hated { background: var(--hated); color: #fff; border-color: var(--hated); }
  .my-rating-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .my-rating-row:last-child { border-bottom: none; }
  .my-rating-title { font-weight: 600; }
  .my-rating-author { color: var(--ink-soft); font-size: 0.85rem; }
  .my-rating-actions { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
  .icon-btn { background: none; border: none; color: var(--ink-soft); font-size: 1rem; padding: 4px 6px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top" id="top-nav"></nav>
  <h1>Rate books</h1>
  <p class="sub">Search the catalog, pick a rating. You can change or remove any rating below at any time. Already have a Goodreads or Fable library? <a href="import.html">Import it instead →</a></p>

  <div class="field">
    <label for="book-search">Search for a book</label>
    <input type="text" id="book-search" placeholder="Title or author…" autocomplete="off">
  </div>
  <div id="results" class="results-box" style="display:none;"></div>

  <details style="margin: -8px 0 20px;">
    <summary style="cursor:pointer; font-size:0.85rem; color:var(--ink-soft);">Can't find a book or series? Suggest it →</summary>
    <div class="field" style="margin-top:10px;">
      <label for="suggest-title">Book or series title</label>
      <input type="text" id="suggest-title" placeholder="e.g. The Blade Itself">
    </div>
    <div class="field">
      <label for="suggest-author">Author (optional)</label>
      <input type="text" id="suggest-author">
    </div>
    <div class="field">
      <label for="suggest-note">Anything else? (optional)</label>
      <input type="text" id="suggest-note" placeholder="e.g. the whole series, or just this one book">
    </div>
    <button class="btn-secondary" id="suggest-submit-btn" style="width:100%;">Send suggestion</button>
  </details>

  <div id="picked" class="card" style="display:none;">
    <div><strong id="picked-title"></strong></div>
    <div class="my-rating-author" id="picked-author"></div>
    <div class="rating-row">
      <button class="rating-btn hated" data-rating="hated">Hated</button>
      <button class="rating-btn disliked" data-rating="disliked">Disliked</button>
      <button class="rating-btn it_was_okay" data-rating="it_was_okay">It was okay</button>
      <button class="rating-btn liked" data-rating="liked">Liked</button>
      <button class="rating-btn loved" data-rating="loved">Loved</button>
    </div>

    <div class="field" style="margin-top:14px; margin-bottom:0;">
      <label>Format</label>
      <div class="chip-row">
        <button type="button" class="chip-btn" data-format="print">Book</button>
        <button type="button" class="chip-btn" data-format="audiobook">Audiobook</button>
      </div>
    </div>

    <div class="field" style="margin-top:14px; margin-bottom:0;">
      <label for="picked-date">When did you read it? (optional)</label>
      <div class="chip-row" id="date-quick-picks" style="margin-bottom:8px;">
        <button type="button" class="chip-btn" data-relative="7">Last week</button>
        <button type="button" class="chip-btn" data-relative="30">Last month</button>
        <button type="button" class="chip-btn" data-relative="90">3 months ago</button>
        <button type="button" class="chip-btn" data-relative="365">Last year</button>
      </div>
      <input type="date" id="picked-date">
      <div style="text-align:center; font-size:0.75rem; color:var(--ink-soft); margin:6px 0;">— or, if you only remember the year —</div>
      <input type="number" id="picked-year" placeholder="e.g. 2013" min="1900" max="2100">
    </div>

    <div class="field" id="reason-field" style="margin-top:14px; margin-bottom:0; display:none;">
      <label>Why? (optional, pick any that apply)</label>
      <div id="reason-checkboxes"></div>
      <input type="text" id="reason-other" placeholder="Say more…" style="margin-top:8px; display:none;">
    </div>

    <button class="btn-primary" id="submit-rating-btn" style="margin-top:18px;">Submit rating</button>
  </div>

  <h2>My ratings</h2>
  <div id="my-ratings" class="results-box"><div class="empty-state">Loading…</div></div>
</div>
<div id="toast"></div>

<script src="shared.js"></script>
<script>
let session, selectedBook = null, searchDebounce = null;
const RATING_LABELS = { loved: 'Loved', liked: 'Liked', it_was_okay: 'It was okay', disliked: 'Disliked', hated: 'Hated' };

(async () => {
  session = await requireAuth();
  if (!session) return;
  renderNav('rate.html', session);
  loadMyRatings();
})();

const searchInput = document.getElementById('book-search');
const resultsEl = document.getElementById('results');
const pickedEl = document.getElementById('picked');

searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  const val = searchInput.value;
  searchDebounce = setTimeout(() => searchBooks(val), 250);
});

// Search matches books, series, AND universes -- a series/universe match
// drills into a book list (ordered by position_in_series) instead of
// selecting a book directly, so a reader can rate a whole series one by
// one without needing to remember every title.
async function searchBooks(query) {
  if (!query || query.trim().length < 2) {
    resultsEl.style.display = 'none';
    resultsEl.innerHTML = '';
    return;
  }
  const pattern = ilikeWordPattern(query);
  const [booksRes, seriesRes, universeRes] = await Promise.all([
    sb.from('books').select('id,title,author,cover_url').or(`title.ilike.${pattern},author.ilike.${pattern}`).order('title').limit(12),
    sb.from('series').select('id,name').ilike('name', pattern).order('name').limit(5),
    sb.from('universe').select('id,name').ilike('name', pattern).order('name').limit(3),
  ]);
  renderSearchResults(seriesRes.data || [], universeRes.data || [], booksRes.data || []);
}

function renderSearchResults(seriesList, universeList, books) {
  if (seriesList.length === 0 && universeList.length === 0 && books.length === 0) {
    resultsEl.innerHTML = '<div class="empty-state">No matches — try a different spelling.</div>';
    resultsEl.style.display = 'block';
    return;
  }
  let html = '';
  if (universeList.length > 0) {
    html += universeList.map((u) => `
      <div class="result-row" data-universe="${u.id}" data-name="${escapeAttr(u.name)}">
        <span class="result-title">${escapeHtml(u.name)}</span>
        <span class="result-author">Universe →</span>
      </div>
    `).join('');
  }
  if (seriesList.length > 0) {
    html += seriesList.map((s) => `
      <div class="result-row" data-series="${s.id}" data-name="${escapeAttr(s.name)}">
        <span class="result-title">${escapeHtml(s.name)}</span>
        <span class="result-author">Series →</span>
      </div>
    `).join('');
  }
  html += books.map((b) => `
    <div class="result-row with-thumb" data-id="${b.id}" data-title="${escapeAttr(b.title)}" data-author="${escapeAttr(b.author || '')}">
      ${b.cover_url ? `<img class="thumb" src="${escapeAttr(b.cover_url)}" alt="" loading="lazy">` : ''}
      <span class="result-title" style="flex:1 1 auto;">${escapeHtml(b.title)}</span>
      <span class="result-author">${escapeHtml(b.author || '')}</span>
    </div>
  `).join('');
  resultsEl.innerHTML = html;
  resultsEl.style.display = 'block';
  wireResultRows();
}

function wireResultRows() {
  resultsEl.querySelectorAll('[data-id]').forEach((row) => {
    row.addEventListener('click', () => pickBook({ id: row.dataset.id, title: row.dataset.title, author: row.dataset.author }));
  });
  resultsEl.querySelectorAll('[data-series]').forEach((row) => {
    row.addEventListener('click', () => showSeriesBooks(row.dataset.series, row.dataset.name));
  });
  resultsEl.querySelectorAll('[data-universe]').forEach((row) => {
    row.addEventListener('click', () => showUniverseSeries(row.dataset.universe, row.dataset.name));
  });
}

function pickBook(book) {
  selectedBook = book;
  document.getElementById('picked-title').textContent = book.title;
  document.getElementById('picked-author').textContent = book.author;
  pickedEl.querySelectorAll('.rating-btn').forEach((b) => b.classList.remove('active'));
  document.getElementById('picked-date').value = '';
  document.getElementById('picked-year').value = '';
  reasonField.style.display = 'none';
  setFormat(getDefaultFormat());
  pickedEl.style.display = 'block';
  resultsEl.style.display = 'none';
  searchInput.value = '';
  pickedEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Existing ratings for the books shown, so a "browse a series" list can
// show what's already rated instead of making the reader guess or
// re-search books they already got to.
async function ratingsMapFor(bookIds) {
  if (bookIds.length === 0) return new Map();
  const { data } = await sb.from('ratings').select('book_id, rating').eq('user_id', session.user.id).in('book_id', bookIds);
  return new Map((data || []).map((r) => [r.book_id, r.rating]));
}

async function showSeriesBooks(seriesId, seriesName) {
  const { data: books } = await sb
    .from('books').select('id,title,author,cover_url,position_in_series')
    .eq('series_id', seriesId).order('position_in_series', { nullsFirst: false });
  const ratedMap = await ratingsMapFor((books || []).map((b) => b.id));
  resultsEl.innerHTML = `
    <div class="result-row" data-back="1" style="cursor:pointer;"><span class="result-title">← Back to search</span></div>
    ${(books || []).map((b) => `
      <div class="result-row with-thumb" data-id="${b.id}" data-title="${escapeAttr(b.title)}" data-author="${escapeAttr(b.author || '')}">
        ${b.cover_url ? `<img class="thumb" src="${escapeAttr(b.cover_url)}" alt="" loading="lazy">` : ''}
        <span class="result-title" style="flex:1 1 auto;">${b.position_in_series ? `#${b.position_in_series} · ` : ''}${escapeHtml(b.title)}</span>
        ${ratedMap.has(b.id) ? `<span class="pill ${ratedMap.get(b.id)}">${RATING_LABELS[ratedMap.get(b.id)]}</span>` : '<span class="result-author">Not rated</span>'}
        <button type="button" class="icon-btn" title="Book info" data-series-info="${b.id}">ⓘ</button>
      </div>
    `).join('') || '<div class="empty-state">No books catalogued for this series yet.</div>'}
  `;
  resultsEl.style.display = 'block';
  wireResultRows();
  resultsEl.querySelector('[data-back]')?.addEventListener('click', () => searchBooks(searchInput.value));
  resultsEl.querySelectorAll('[data-series-info]').forEach((btn) => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    showBookInfo(btn.dataset.seriesInfo);
  }));
}

async function showUniverseSeries(universeId, universeName) {
  const { data: seriesList } = await sb.from('series').select('id,name').eq('universe_id', universeId).order('name');
  resultsEl.innerHTML = `
    <div class="result-row" data-back="1" style="cursor:pointer;"><span class="result-title">← Back to search</span></div>
    ${(seriesList || []).map((s) => `
      <div class="result-row" data-series="${s.id}" data-name="${escapeAttr(s.name)}">
        <span class="result-title">${escapeHtml(s.name)}</span>
        <span class="result-author">Series →</span>
      </div>
    `).join('') || '<div class="empty-state">No series catalogued for this universe yet.</div>'}
  `;
  resultsEl.style.display = 'block';
  wireResultRows();
  resultsEl.querySelector('[data-back]')?.addEventListener('click', () => searchBooks(searchInput.value));
}

// Reason is optional and multi-select (item #1) -- checkboxes rather
// than a single dropdown, plus a free-text "Other". Option sets differ
// by sentiment (a "loved it" reason list makes no sense for "hated it").
const REASON_OPTIONS = {
  positive: ['Great characters', 'Compelling plot', 'Beautiful writing/prose', 'Immersive worldbuilding', 'Emotional impact', "Couldn't put it down", 'Other'],
  neutral: ['Started strong, lost me later', 'Fine but forgettable', 'Good in parts, uneven overall', 'Not what I expected', 'Other'],
  negative: ['Weak characters', 'Slow pacing', 'Confusing or messy plot', "Prose didn't work for me", "Didn't like the ending", 'Not my genre/vibe', 'Other'],
};
function reasonGroupFor(rating) {
  if (rating === 'loved' || rating === 'liked') return 'positive';
  if (rating === 'it_was_okay') return 'neutral';
  return 'negative';
}
const reasonField = document.getElementById('reason-field');
const reasonCheckboxesEl = document.getElementById('reason-checkboxes');
const reasonOther = document.getElementById('reason-other');

// preselected: existing `reasons` array when editing a rating, [] for a
// fresh pick. Any preselected string that isn't one of the fixed
// options is treated as free text typed under "Other" previously.
function renderReasonCheckboxes(group, preselected) {
  const options = REASON_OPTIONS[group];
  const known = options.filter((o) => o !== 'Other');
  const customValues = preselected.filter((r) => !known.includes(r));
  reasonCheckboxesEl.innerHTML = options.map((o) => `
    <label class="checkbox-row">
      <input type="checkbox" value="${escapeAttr(o)}" ${(o !== 'Other' && preselected.includes(o)) ? 'checked' : ''}>
      ${escapeHtml(o)}
    </label>
  `).join('');
  const otherCb = reasonCheckboxesEl.querySelector('input[value="Other"]');
  const hasCustom = customValues.length > 0;
  otherCb.checked = hasCustom;
  reasonOther.style.display = hasCustom ? 'block' : 'none';
  reasonOther.value = hasCustom ? customValues.join('; ') : '';
  otherCb.addEventListener('change', () => {
    reasonOther.style.display = otherCb.checked ? 'block' : 'none';
    if (otherCb.checked) reasonOther.focus();
  });
}
function collectReasons() {
  const checked = [...reasonCheckboxesEl.querySelectorAll('input[type=checkbox]:checked')].map((cb) => cb.value);
  const reasons = checked.filter((v) => v !== 'Other');
  if (checked.includes('Other')) {
    const text = reasonOther.value.trim();
    if (text) reasons.push(text);
  }
  return reasons.length > 0 ? reasons : null;
}

// Format (item #4): remembers the last format used in this browser so a
// reader working through an audiobook series doesn't have to reselect
// it every time; defaults to "print" before any rating has ever set it.
function getDefaultFormat() {
  try { return localStorage.getItem('bookspell-last-format') || 'print'; } catch (e) { return 'print'; }
}
let selectedFormat = 'print';
function setFormat(fmt) {
  selectedFormat = fmt;
  document.querySelectorAll('[data-format]').forEach((b) => b.classList.toggle('active', b.dataset.format === fmt));
}
document.querySelectorAll('[data-format]').forEach((b) => b.addEventListener('click', () => setFormat(b.dataset.format)));

// Relative date quick-picks (item #3) -- readers rarely remember an
// exact date but often remember "about 3 months ago." Each button just
// fills in the real date/year field; the field itself is still the
// source of truth at submit time, so typing over a quick-pick works too.
const pickedDateEl = document.getElementById('picked-date');
const pickedYearEl = document.getElementById('picked-year');
document.querySelectorAll('[data-relative]').forEach((b) => b.addEventListener('click', () => {
  const days = parseInt(b.dataset.relative, 10);
  pickedDateEl.value = new Date(Date.now() - days * 86400000).toISOString().slice(0, 10);
  pickedYearEl.value = '';
}));
pickedDateEl.addEventListener('input', () => { pickedYearEl.value = ''; });
pickedYearEl.addEventListener('input', () => { pickedDateEl.value = ''; });

pickedEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.rating-btn');
  if (!btn || !selectedBook) return;
  pickedEl.querySelectorAll('.rating-btn').forEach((b) => b.classList.remove('active'));
  btn.classList.add('active');
  renderReasonCheckboxes(reasonGroupFor(btn.dataset.rating), []);
  reasonField.style.display = 'block';
});

// Item #7: rating no longer auto-saves the instant a sentiment button
// is clicked -- that was fast, but discouraged ever filling in the
// optional fields below it. Everything (rating, format, date, reasons)
// now goes in one upsert on explicit "Submit rating," after which the
// whole panel resets rather than sitting there looking half-done.
document.getElementById('submit-rating-btn').addEventListener('click', async () => {
  if (!selectedBook) return;
  const activeBtn = pickedEl.querySelector('.rating-btn.active');
  if (!activeBtn) return showToast('Pick a rating first.');
  const rating = activeBtn.dataset.rating;
  const ratedDate = pickedDateEl.value || (pickedYearEl.value ? `${pickedYearEl.value}-07-01` : null);
  const reasons = collectReasons();

  const { error } = await sb.from('ratings').upsert(
    { user_id: session.user.id, book_id: selectedBook.id, rating, rated_date: ratedDate, reasons, format: selectedFormat, source: 'manual' },
    { onConflict: 'user_id,book_id' }
  );
  if (error) return showToast(`Couldn't save: ${error.message}`);
  try { localStorage.setItem('bookspell-last-format', selectedFormat); } catch (e) { /* ignore */ }
  showToast(`Saved: ${selectedBook.title} — ${RATING_LABELS[rating]}`);
  resetPickedPanel();
  loadMyRatings();
});

function resetPickedPanel() {
  pickedEl.style.display = 'none';
  selectedBook = null;
  pickedEl.querySelectorAll('.rating-btn').forEach((b) => b.classList.remove('active'));
  pickedDateEl.value = '';
  pickedYearEl.value = '';
  reasonField.style.display = 'none';
  reasonOther.value = '';
  reasonOther.style.display = 'none';
  searchInput.value = '';
  resultsEl.style.display = 'none';
}

document.getElementById('suggest-submit-btn').addEventListener('click', async () => {
  const title = document.getElementById('suggest-title').value.trim();
  if (!title) return showToast('Enter a title first.');
  const author = document.getElementById('suggest-author').value.trim() || null;
  const note = document.getElementById('suggest-note').value.trim() || null;
  const { error } = await sb.from('book_suggestions').insert({ user_id: session.user.id, title, author, note });
  if (error) return showToast(`Couldn't send: ${error.message}`);
  showToast('Thanks — sent to the team.');
  document.getElementById('suggest-title').value = '';
  document.getElementById('suggest-author').value = '';
  document.getElementById('suggest-note').value = '';
});

async function loadMyRatings() {
  const container = document.getElementById('my-ratings');
  const { data, error } = await sb
    .from('ratings')
    .select('id, book_id, rating, rated_date, reasons, format, updated_at, books(title, author, cover_url)')
    .order('updated_at', { ascending: false });
  if (error) {
    container.innerHTML = `<div class="empty-state">Couldn't load your ratings: ${escapeHtml(error.message)}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    container.innerHTML = '<div class="empty-state">Nothing rated yet — search above to start.</div>';
    return;
  }
  container.innerHTML = data.map((r) => `
    <div class="my-rating-row with-thumb">
      ${r.books?.cover_url ? `<img class="thumb" src="${escapeAttr(r.books.cover_url)}" alt="" loading="lazy">` : ''}
      <div style="flex:1 1 auto;">
        <div class="my-rating-title">${escapeHtml(r.books?.title || '(unknown title)')}</div>
        <div class="my-rating-author">${escapeHtml(r.books?.author || '')} · <span class="pill ${r.rating}">${RATING_LABELS[r.rating]}</span>${r.format ? ` · ${titleCase(r.format)}` : ''}${r.rated_date ? ` · <span title="${escapeAttr(r.rated_date)}">${escapeHtml(formatRelativeDate(r.rated_date))}</span>` : ''}</div>
      </div>
      <div class="my-rating-actions">
        <button class="icon-btn" title="Book info" data-info="${r.book_id}">ⓘ</button>
        <button class="icon-btn" title="Change rating" data-edit="${r.book_id}" data-title="${escapeAttr(r.books?.title || '')}" data-author="${escapeAttr(r.books?.author || '')}" data-date="${r.rated_date || ''}" data-current-rating="${r.rating}" data-reasons="${escapeAttr(JSON.stringify(r.reasons || []))}" data-format="${r.format || ''}">✎</button>
        <button class="icon-btn" title="Remove" data-delete="${r.id}">✕</button>
      </div>
    </div>
  `).join('');
  container.querySelectorAll('[data-info]').forEach((b) => b.addEventListener('click', () => showBookInfo(b.dataset.info)));
  container.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => {
    selectedBook = { id: b.dataset.edit, title: b.dataset.title, author: b.dataset.author };
    document.getElementById('picked-title').textContent = selectedBook.title;
    document.getElementById('picked-author').textContent = selectedBook.author;
    pickedDateEl.value = b.dataset.date || '';
    pickedYearEl.value = '';
    pickedEl.querySelectorAll('.rating-btn').forEach((rb) => rb.classList.toggle('active', rb.dataset.rating === b.dataset.currentRating));
    setFormat(b.dataset.format || getDefaultFormat());
    renderReasonCheckboxes(reasonGroupFor(b.dataset.currentRating), JSON.parse(b.dataset.reasons || '[]'));
    reasonField.style.display = 'block';
    pickedEl.style.display = 'block';
    pickedEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  container.querySelectorAll('[data-delete]').forEach((b) => b.addEventListener('click', async () => {
    const { error: delErr } = await sb.from('ratings').delete().eq('id', b.dataset.delete);
    if (delErr) return showToast(`Couldn't remove: ${delErr.message}`);
    showToast('Rating removed.');
    loadMyRatings();
  }));
}
</script>
</body>
</html>
