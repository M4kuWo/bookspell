# Blind DNA tagging pilot — 30 books, tagged BEFORE any read/liked/unread
# reveal, grounded in real synopsis + review research per book (never full
# text). Companion to book-dna.schema.yaml — this is a test corpus, not
# part of the schema itself. See findings.md for cross-cutting schema
# gaps this pass surfaced.
#
# audiobook_native skipped throughout — not assessable from web research
# for arbitrary titles in this pilot.
#
# Post-tagging corrections applied after user review (see findings.md):
# - content_warnings' reveals_spoiler axis (added to the schema after
#   this corpus was first tagged) defaults to false for every entry below
#   except where explicitly marked true — not exhaustively backfilled
#   across all 30 books, since only Perdido Street Station's instance was
#   actually identified as a concealed plot reveal.
# - Interview with the Vampire's genre_fit was reconsidered and corrected
#   (see its entry) — vampirism is legitimate fantasy genre furniture
#   (internally-ruled supernatural power system), unlike Bird Box's
#   deliberately unexplained entities or The Road's complete absence of
#   any fantastical element.
# - timeline: dual_timeline renamed to multi_timeline; drive:
#   worldbuilding_driven and 13 new tropes added post-pilot — see
#   individual entries below and findings.md for full reasoning.

pilot_version: 1
tagged_against_schema_version: 0.1.0-draft
