# Book DNA schema — machine-readable draft
#
# Status: DRAFT, v0.1 — pending review (see book-dna.md, "Open for review")
# This is the source of truth to generate, later:
#   - Postgres columns for `book_dna` (step 02 of the roadmap)
#   - the JSON schema handed to the LLM tagging pipeline (step 04)
#   - filter UI + the natural-language assistant's parse targets (step 06)
#
# Conventions:
#   - every field has: type (enum | multi_enum), values, spoiler
#   - spoiler: true means the recommendation engine always reads the real
#     value, but the UI must gate display (see spoiler_horizon note at
#     the bottom for series-level gating)
#   - multi_enum "tropes" carries spoiler per-value, since most tropes are
#     safe and a few specific ones aren't

schema_version: 0.1.0-draft

# Every book gets this regardless of category — the hook that lets a future
# genre module (romance, literary fiction, ...) be new rows + a new
# extension category instead of a schema migration.
genre_field:
  id: genre
  type: multi_enum
  values: [sci_fi, fantasy]  # closed for v1; will open up post-v1
  spoiler: false

# Bibliographic fact, not a taste attribute — but a real, mostly-objective
# axis readers have strong preferences on, independent of genre or any
# DNA field. Added after real user feedback flagged it as a gap (user
# likes The Golden Compass despite a general YA aversion).
age_category_field:
  id: age_category
  type: enum
  values: [middle_grade, ya, new_adult, adult]
  spoiler: false

# Same shape as age_category: a bibliographic fact (derived from page/word
# count, standard metadata from every source in the sourcing plan), not an
# intrinsic taste attribute — but a real axis readers have strong, often
# hard-threshold preferences on, independent of genre/tone/trope. Someone
# avoiding The Wheel of Time isn't reacting to its tropes, they're
# reacting to "14 books"; someone avoiding Stormlight isn't avoiding epic
# fantasy, they're avoiding ~450,000-word individual volumes. Two
# genuinely different axes — this field covers per-book length; series
# length (book_count) lives on the `series` entity instead, see "Series &
# universe" below, since it's a series-level fact, not a book-level one.
# The raw page/word count itself is plain bibliographic data in the
# `books` table; this field is the bucketed version used for similarity
# scoring. Gets the same three-tier treatment as content_warnings/tropes:
# soft signal, informational display, and — likely more load-bearing here
# than for most fields — an explicit opt-in cap ("nothing over 500
# pages" / "no series longer than 6 books"), since approachability is
# often a hard threshold, not a graduated taste.
book_length_field:
  id: book_length
  type: enum
  values: [short, standard, long, epic]
  # Rough guidance, not a hard rule — bucket from actual page/word count:
  # short: under ~350pp / ~100k words. standard: ~350-500pp / 100-140k.
  # long: ~500-700pp / 140-200k. epic: 700pp+ / 200k+ (Stormlight-tier).
  spoiler: false

categories:

  pov_structure:
    label: Point of view & structure
    scope: core
    fields:
      pov_count:
        type: enum
        values: [single, dual, few, several, ensemble]
        # widened 2026-08-29 from a binary single/multiple. User
        # feedback: Kings of Paradise (~3 POVs) and A Game of Thrones
        # (~9 POVs) were both just "multiple" -- real information lost,
        # and it matters for recommendation quality specifically (a
        # reader who likes a few rotating POVs may be overwhelmed by a
        # GRRM-scale ensemble, or vice versa). Buckets: single (1),
        # dual (2), few (3-4), several (5-7), ensemble (8+). This is
        # ordinal now (see recommend.py), not nominal -- a "few" book
        # scores partial similarity to an "ensemble" book instead of a
        # flat match/no-match. Counts recurring, page-time-significant
        # POV characters -- see the deferred exact-count idea below.
        spoiler: false
      person:
        type: enum
        values: [first, second, third_limited, third_omniscient, mixed]
        # mixed = different POV threads use different persons (e.g. The
        # Fifth Season: one thread in 2nd person, others in 3rd) —
        # surfaced by the 30-book pilot; only relevant alongside
        # pov_count: multiple.
        spoiler: false
      narrator_reliability:
        type: enum
        values: [reliable, unreliable]
        spoiler: false
      timeline:
        type: enum
        values: [linear, nonlinear, multi_timeline]
        # multi_timeline replaces the old dual_timeline (was hard-coded to
        # exactly two) — generalizes to any number of interwoven
        # timelines. The similarity math cares whether a book uses this
        # structural device at all, not the exact count.
        spoiler: false
      form:
        type: enum
        values: [standard_prose, epistolary, framing_device, verse, embedded_system_text, script_or_stage_play]
        # embedded_system_text added after the same gap recurred 6+ times
        # across three tagging rounds (He Who Fights with Monsters, The
        # Gate of the Feral Gods, Carl's Doomsday Scenario, Dungeon
        # Crawler Carl, The Butcher's Masquerade, This Inevitable Ruin,
        # The Eye of the Bedlam Bride, The Dungeon Anarchist's Cookbook) —
        # LitRPG's defining structural device (game-notification/stat-
        # block text interleaved with standard narrative prose) had no
        # value at all; every instance was previously force-fit into
        # standard_prose.
        # script_or_stage_play added 2026-08-30, surfaced by Harry Potter
        # and the Cursed Child — a stage-play script (dialogue + stage
        # directions, no narrative prose) had no vocabulary match; every
        # other value assumes some form of prose narration exists.
        spoiler: false
      prose_density:
        type: enum
        values: [sparse, moderate, lush]
        # How much physical/sensory/environmental description the prose
        # carries — sparse (dialogue/action-forward, minimal scene-setting;
        # Sanderson, Six of Crows) vs. lush (extensive immersive detail;
        # The Fellowship of the Ring, The Priory of the Orange Tree, The
        # Name of the Wind). Distinct from worldbuilding_density (how much
        # of the WORLD's lore/rules get explained) — a book can have dense
        # worldbuilding delivered in sparse prose, or light worldbuilding
        # described lushly. User-sourced field: readers have a durable,
        # independent preference on prose texture itself.
        spoiler: false
      prose_complexity:
        type: enum
        values: [accessible, moderate, dense]
        # Vocabulary and sentence-structure difficulty — accessible
        # (commercial-fiction register; most YA, Sanderson, Weir) vs. dense
        # (archaic/elevated vocabulary, complex syntax; Piranesi, Jonathan
        # Strange & Mr Norrell, Frankenstein). Distinct from prose_density
        # (amount of description) — a book can be simply worded but
        # heavily descriptive, or sparse but syntactically demanding.
        # Particularly relevant for an audiobook-native product: dense
        # prose is harder to follow by ear than by eye. User-sourced field.
        spoiler: false

  pacing_tone:
    label: Pacing & tone
    scope: core
    fields:
      overall_pace:
        type: enum
        values: [slow, medium, fast]
        spoiler: false
      pace_shape:
        type: enum
        values: [consistent, slow_burn_to_fast_finish, front_loaded, uneven]
        spoiler: false
      drive:
        type: enum
        values: [character_driven, plot_driven, balanced, worldbuilding_driven]
        # worldbuilding_driven added after the pilot: New Weird-style books
        # (Perdido Street Station) are consistently described as driven by
        # the setting itself, not character/plot/an even split of the two.
        spoiler: false
      darkness:
        type: enum
        values: [light, moderate, dark, grimdark]
        spoiler: false
      humor_level:
        type: enum
        values: [none, light, moderate, heavy]
        spoiler: false
      emotional_register:
        type: enum
        values: [comfort_read, bittersweet, tense, gut_punch]
        spoiler: false
      message_intensity:
        type: enum
        values: [subtle, moderate, heavy_handed]
        # How OVERTLY the book pushes a moral/philosophical argument —
        # deliberately NOT which argument (see the schema's ideological-
        # neutrality decision in book-dna.md). A reader can be averse to
        # heavy-handedness itself regardless of the specific message (e.g.
        # disliking both an overt pacifism theme and an overt religious-
        # redemption theme in different books) — this field lets that
        # generalized aversion be learned from ratings without the schema
        # ever tagging which position a book argues.
        spoiler: false
      intellectual_weight:
        type: enum
        values: [escapist, moderate, cerebral]
        # How much the book invites philosophical/ethical/psychological
        # reflection vs. functions as plot-forward entertainment —
        # escapist (Fourth Wing, Six of Crows, Ready Player One) vs.
        # cerebral (Ender's Game, The Left Hand of Darkness, Never Let Me
        # Go, Flowers for Algernon). Distinct from message_intensity (how
        # OVERTLY a specific argument is pushed — a subtle book can still
        # be cerebral, a heavy-handed one can still be pure escapism) and
        # from darkness (tone, not depth of thought invited). User-sourced
        # field, from the "John Wick is fun but Ender's Game makes you
        # think" distinction.
        spoiler: false

  content_shape:
    label: Content & shape
    scope: core
    fields:
      romance_heat_frequency:
        type: enum
        values: [none, rare, occasional, frequent]
        spoiler: false
      romance_heat_intensity:
        type: enum
        values: [na, closed_door, low, moderate, explicit]
        spoiler: false
      violence_frequency:
        type: enum
        values: [none, rare, occasional, frequent]
        spoiler: false
      violence_intensity:
        type: enum
        values: [na, mild, moderate, graphic, brutal]
        # `brutal` added after direct reader comparison across the 30-book
        # pilot corpus: books as different in actual violence experience
        # as The Way of Kings and Kings of Paradise/Prince of Thorns were
        # both landing on `graphic`, the top of a 4-point scale — the same
        # "top bucket absorbing too wide a range" problem `darkness`
        # already solved by adding `grimdark` above `dark`. `brutal` is
        # for extreme, dwelled-upon violence (detailed dismemberment,
        # prolonged torture) — distinct from `graphic`, which still reads
        # as clearly violent but not lingering on extremity.
        spoiler: false
      content_warnings:
        type: multi_enum
        spoiler: false  # neutral data, not editorial — see book-dna.md
        # Each per-book selection also carries TWO per-instance axes below
        # — neither is a fixed property of the vocabulary item (unlike
        # tropes' per-value `spoiler`), since both vary by book, not by
        # warning type. Stored per (book, warning) pair, e.g. a join table
        # in step 02, not baked into the vocabulary list itself.
        value_severity: [brief, moderate, central_theme]
        # How much of the book this warning covers — see book-dna.md.
        value_reveals_spoiler: [false, true]
        # Whether flagging this warning ON THIS BOOK gives away a plot
        # point. Most instances of most warnings are known from the start
        # (false) — but the same warning type can be a late, concealed
        # reveal on a different book (e.g. Perdido Street Station's
        # sexual_assault: Yagharek's crime is hidden until deep in the
        # book). This is why it's per-instance, not a per-value spoiler
        # flag like tropes has: sexual_assault itself isn't inherently a
        # spoiler, this specific book's use of it is. The UI gates display
        # of true=instances the same way any other spoiler field does; the
        # recommendation engine always reads the real value regardless.
        values:
          - sexual_assault
          - dubious_consent
          - self_harm
          - suicide
          - eating_disorder
          - child_death
          - child_abuse
          - animal_harm
          - domestic_abuse
          - substance_abuse
          - torture
          - body_horror
          - hate_speech_depicted
          - ableism_depicted
          - racism_depicted
          - colonization_themes
          - slavery
          - genocide
          - war_trauma
          - religious_trauma_or_cults
          - mental_illness_depiction
          - pregnancy_loss
          - kidnapping_or_captivity
          - sexual_harassment
          - emotional_abuse
          - child_sexual_abuse
          - stalking
          - trafficking
          - classism
          - sexism_or_misogyny_depicted
          - infertility
          - abortion
          - bullying
          - pandemic_or_epidemic
          # added after the remaining-catalog round: Station Eleven's
          # entire premise is civilizational collapse from a fast-moving
          # flu, and neither child_death nor war_trauma fit mass death
          # from disease specifically — a real gap for a subgenre
          # (plague fiction) the catalog will keep encountering.
          - fictional_species_prejudice
          # distinct from racism_depicted (written for real-world-analog
          # prejudice) — covers in-world bigotry against a fantasy
          # species/kind (The Cruel Prince's fae-vs-human contempt, The
          # House in the Cerulean Sea's anti-magical-youth bigotry).
          - incest
          # surfaced by One Hundred Years of Solitude, where it's a
          # recurring, central device (not a single incidental instance) —
          # no existing warning covered it.
          - chronic_illness_or_disability
          # distinct from ableism_depicted (which covers depicted
          # prejudice against a disabled character) — this covers the
          # lived experience of chronic illness/disability itself as a
          # throughline, independent of whether prejudice is also shown
          # (Tomorrow, and Tomorrow, and Tomorrow's Sam).
      worldbuilding_density:
        type: enum
        values: [light, moderate, dense]
        spoiler: false
      stakes_scope:
        type: enum
        values: [intimate, regional, global, cosmic]
        # The BREADTH of what's at risk — how large a footprint is
        # threatened, independent of how severe the danger is for any
        # one character. intimate (personal relationships/small cast;
        # Legends & Lattes, The House in the Cerulean Sea, Before the
        # Coffee Gets Cold) → regional (a city/kingdom/single planet;
        # The Lies of Locke Lamora) → global (an entire civilization is
        # at stake, however large that civilization is — this includes
        # galaxy-spanning single-universe empires like Dune, Foundation,
        # or Star Wars, not just one planet) → cosmic (stakes that go
        # beyond one universe/reality entirely: multiverse, alternate
        # dimensions, existential threats to reality itself — Death's
        # End, A Darker Shade of Magic's parallel Londons). Deliberately
        # does NOT capture how dangerous things are for the protagonist
        # personally — see personal_stakes below, added specifically
        # because this field was originally conflating the two (a boy
        # who might get scolded for losing a toy and a man forced by the
        # mafia into a deadly heist are both "intimate" in scope, but
        # obviously not the same book to read). Also distinct from
        # worldbuilding_density (how much lore gets explained, not how
        # big the stakes are) and darkness (tone, not scale) — a cozy,
        # low-stakes book can still be tonally dark, and an epic-stakes
        # book can still be tonally light.
        spoiler: false
      personal_stakes:
        type: enum
        values: [low, moderate, high, life_threatening]
        # How dire the risk is for the protagonist SPECIFICALLY, however
        # big or small the story's scope is. low (The House in the
        # Cerulean Sea, Legends & Lattes — nobody's life is ever on the
        # line) → moderate (Good Omens' immortal protagonists watching
        # the apocalypse approach without personally risking death; The
        # Invisible Life of Addie LaRue, whose curse makes her literally
        # unkillable — her real stake is being forgotten, not dying) →
        # high (real, serious danger short of the story treating death
        # as the live central threat) → life_threatening (Ender's Game,
        # The Lies of Locke Lamora — the protagonist's actual death is a
        # real, present possibility). Added alongside stakes_scope as a
        # deliberate split of what was one field: scope is about breadth
        # (how much of the world is threatened), this is about severity
        # for the protagonist — independent axes (The Time Traveler's
        # Wife and The Green Mile are both intimate in scope but
        # life_threatening; Circe is intimate in scope and only high,
        # not life_threatening, since she's an immortal goddess and her
        # own death was never really the threat).
        spoiler: false
      narrative_closure:
        type: enum
        values: [self_contained, requires_series]
        spoiler: false
        # Intrinsic to the text, stable once published — does THIS book
        # resolve its own plot, or does it require other books to.
        # Series/universe MEMBERSHIP is deliberately not a field here — see
        # "Series & universe" note at the bottom of this file.
      emotional_resolution:
        type: enum
        values: [happy, tragic, ambiguous, bittersweet]
        spoiler: true
      ends_on_cliffhanger:
        type: enum
        values: [resolved, cliffhanger]
        spoiler: true
        # Distinct from narrative_closure (a series-level structural fact:
        # does this book NEED future installments to resolve its arc) and
        # from emotional_resolution above. A book can requires_series with
        # a non-cliffhanger ending (episodic — resolves this installment's
        # immediate conflict, sets up the next without withholding
        # resolution), or emotional_resolution: happy while still ending
        # on a cliffhanger (a personal beat lands even though the external
        # plot is left hanging).

  audiobook_native:
    label: Audiobook-native
    scope: core
    wedge: true
    # Split 2026-08-29 into two tiers after realizing this whole module
    # was 100% untagged across the catalog. Tier A (narrator_cast,
    # audiobook_length, narrator names on `books.narrators`) is ordinary
    # publisher/retailer metadata -- cheap to source, worth completing.
    # Tier B (narrator_performance, narration_pace_vs_prose,
    # accent_authenticity, production_quality) is subjective listening
    # judgment -- how theatrical, how distinct the character voices are,
    # how well the narrator handles the opposite sex, etc. -- data that
    # doesn't exist as ordinary metadata anywhere. The only quasi-reliable
    # existing sources are professional audiobook critics (AudioFile
    # Magazine reviews/Earphones Awards, the Audie Awards) or mining
    # Audible reviews for narrator sentiment, and both have real coverage
    # gaps (most books were never professionally audio-reviewed) plus a
    # genuine sourcing-effort cost, unlike Book DNA content fields which
    # mostly come from reading the book itself. Tier B deliberately
    # deferred -- see project-log.md 2026-08-29 entry.
    fields:
      narrator_performance:
        type: enum
        values: [poor, average, good, excellent]
        spoiler: false
        # Tier B -- deferred, see module-level note above.
      narrator_cast:
        type: enum
        values: [single_narrator, dual_narrator, full_cast]
        spoiler: false
        # Tier A -- computable from books.narrators (array length) plus
        # knowing whether a production is a full-cast dramatization
        # (relevant to the deferred audiobook_editions/GraphicAudio idea).
      narration_pace_vs_prose:
        type: enum
        values: [matches, slower, faster]
        spoiler: false
        # Tier B -- deferred, see module-level note above.
      accent_authenticity:
        type: enum
        values: [na, poor, adequate, excellent]
        spoiler: false
        # Tier B -- deferred, see module-level note above.
      production_quality:
        type: enum
        values: [basic, standard, high]
        spoiler: false
        # Tier B -- deferred, see module-level note above.
      audiobook_length:
        type: enum
        values: [short, standard, long, epic]
        # Bucketed from actual listening hours, NOT derived from
        # book_length — narration pace means the two can diverge (a
        # deliberate, measured narrator can make a standard-length novel
        # feel long to listen to; a brisk one can do the reverse), and for
        # an audiobook-first product, hours-to-listen is the more relevant
        # approachability signal than page count for a large share of
        # users. Rough guidance: short < 8h, standard 8-15h, long 15-25h,
        # epic 25h+ (Stormlight-tier audiobooks routinely run 45-55h).
        # Skipped for the 30-book pilot corpus along with every other
        # audiobook_native field — not assessable from web research.
        spoiler: false

  tropes_craft:
    label: Tropes & craft
    scope: sff_extension
    genre: [sci_fi, fantasy]
    fields:
      magic_system_hardness:
        type: enum
        values: [hard, soft, none, na]
        # none = a fantasy-genre book that simply has no magic system in
        # it (the concept applies to this genre but isn't present here).
        # na = the concept doesn't apply at all — a pure sci-fi book with
        # no fantasy element (use scifi_hardness instead). Left undefined
        # until the pilot forced an inference — now documented.
        #
        # Tagged per-book based on what THIS BOOK actually reveals to the
        # reader, not omniscient full-series knowledge -- confirmed
        # 2026-08-31 via external reader feedback questioning why The Eye
        # of the World (Wheel of Time book 1) is "soft" when the One
        # Power is a well-defined, rule-based system by later books. It's
        # soft in book 1 specifically because the reader hasn't been
        # shown the rules yet (weaves, the Five Powers, the taint) --
        # channeling is experienced as mysterious, not mechanical, at
        # this point in the story. Checked: every subsequently-tagged WoT
        # book is "hard" (The Great Hunt onward) -- this progression was
        # already being applied consistently, just never written down.
        # Same principle as spoiler gating and Series DNA trajectories:
        # Book DNA reflects the reader's experience of THIS book, not
        # meta-knowledge from the rest of the series.
        spoiler: false
      scifi_hardness:
        type: enum
        values: [hard, soft, na]
        # na = book has no significant sci-fi/tech component (pure fantasy).
        # Direct sci-fi analog to magic_system_hardness: how rigorously the
        # science/tech is explained and grounded in real/plausible physics
        # vs. treated as unexplained narrative furniture (e.g. FTL travel
        # just works). A well-established reader-facing axis that had no
        # equivalent field until this review flagged the gap.
        spoiler: false
      tropes:
        type: multi_enum
        # `group` is doc/UI grouping only — all tropes are one flat
        # controlled vocabulary for the similarity math regardless of
        # group. Groups exist so a filter UI can organize ~95 options
        # instead of showing one long flat checklist.
        #
        # Vocabulary growth is an ongoing practice, not a one-time pass:
        # during real tagging (step 04), when a book's defining device
        # doesn't fit the existing vocabulary, that's a candidate addition
        # — reviewed against the same bar used throughout this schema's
        # review ("does this predict a different recommendation, not just
        # is it a real term") before being added. The 13 entries added
        # after the 30-book pilot (marked with pilot-sourced comments
        # below) are the first real instance of this practice, not a
        # special one-off.
        values:
          # -- character archetypes (protagonist + antagonist) --
          - {id: chosen_one, group: character_archetypes, spoiler: false}
          - {id: reluctant_hero, group: character_archetypes, spoiler: false}
          - {id: anti_hero, group: character_archetypes, spoiler: false}
          - {id: villain_protagonist, group: character_archetypes, spoiler: false}
          - {id: cursed_protagonist, group: character_archetypes, spoiler: false}
          - {id: morally_grey_protagonist, group: character_archetypes, spoiler: false}
          - {id: secret_royalty, group: character_archetypes, spoiler: false}
          - {id: immortal_or_ageless_character, group: character_archetypes, spoiler: false}
          - {id: reincarnated_protagonist, group: character_archetypes, spoiler: false}
          - {id: hidden_talent_prodigy, group: character_archetypes, spoiler: false}  # untrained character suddenly shows exceptional skill — distinct from chosen_one, which is destiny-driven rather than skill-driven
          - {id: coming_of_age, group: character_archetypes, spoiler: false}  # protagonist's growth from childhood/adolescence into adulthood is the book's central arc — distinct from hidden_talent_prodigy and underdog_rising, which are about skill/status arcs, not growing up per se
          - {id: berserker_rage, group: character_archetypes, spoiler: false}  # added 2026-08-29 -- a character whose combat power source is uncontrolled/building rage itself (Logen Ninefingers' "the Bloody-Nine" in The Blade Itself, Kratos-style rage meters) — distinct from anti_hero/morally_grey_protagonist (moral positioning, not a power mechanic) and immortal_or_ageless_character (a trait, not a combat mechanic)
          - {id: wise_mentor, group: character_archetypes, spoiler: false}
          - {id: underdog_rising, group: character_archetypes, spoiler: false}  # powerless-to-strong arc
          - {id: dark_lord_or_evil_overlord, group: character_archetypes, spoiler: false}
          - {id: ghost_sight, group: character_archetypes, spoiler: false}  # protagonist can see/interact with ghosts specifically — Ninth House; distinct from telepathic_animal_bond (a different, non-human bond) and immortal_or_ageless_character (a trait, not a perceptual ability)

          # -- romance & relationships --
          - {id: enemies_to_lovers, group: romance_relationships, spoiler: false}
          - {id: friends_to_lovers, group: romance_relationships, spoiler: false}
          - {id: forbidden_love, group: romance_relationships, spoiler: false}
          - {id: love_triangle, group: romance_relationships, spoiler: false}
          - {id: fated_mates, group: romance_relationships, spoiler: false}
          - {id: soulmate_bond, group: romance_relationships, spoiler: false}
          - {id: arranged_marriage, group: romance_relationships, spoiler: false}
          - {id: marriage_of_convenience, group: romance_relationships, spoiler: false}
          - {id: fake_dating, group: romance_relationships, spoiler: false}
          - {id: forced_proximity, group: romance_relationships, spoiler: false}
          - {id: only_one_bed, group: romance_relationships, spoiler: false}
          - {id: age_gap_romance, group: romance_relationships, spoiler: false}
          - {id: second_chance_romance, group: romance_relationships, spoiler: false}
          - {id: grumpy_sunshine, group: romance_relationships, spoiler: false}
          # distinct from pace_shape.slow_burn_to_fast_finish, which is
          # overall plot pacing — this is specifically the romance subplot
          - {id: slow_burn_romance, group: romance_relationships, spoiler: false}
          - {id: found_family, group: romance_relationships, spoiler: false}
          - {id: monster_or_fae_romance, group: romance_relationships, spoiler: false}
          - {id: insta_love, group: romance_relationships, spoiler: false}  # structural opposite of slow_burn_romance
          - {id: hidden_identity_romance, group: romance_relationships, spoiler: false}  # love interest conceals true nature — broader than secret_royalty (could be a spy, a god, a monster)
          - {id: reverse_harem_or_why_choose, group: romance_relationships, spoiler: false}  # relationship STRUCTURE (one protagonist, multiple love interests, no forced choice), not just flavor
          - {id: telepathic_animal_bond, group: romance_relationships, spoiler: false}  # non-romantic bond, grouped alongside found_family per that precedent — e.g. Robin Hobb's Wit, His Dark Materials' daemons; surfaced by the 30-book pilot (Assassin's Apprentice)

          # -- setting & worldbuilding --
          - {id: magic_school, group: setting_worldbuilding, spoiler: false}
          - {id: portal_fantasy, group: setting_worldbuilding, spoiler: false}
          - {id: medieval_european_setting, group: setting_worldbuilding, spoiler: false}
          - {id: non_european_inspired_setting, group: setting_worldbuilding, spoiler: false}
          - {id: lost_civilizations, group: setting_worldbuilding, spoiler: false}
          - {id: fae_courts, group: setting_worldbuilding, spoiler: false}
          - {id: high_fantasy_setting, group: setting_worldbuilding, spoiler: false}
          - {id: urban_fantasy_setting, group: setting_worldbuilding, spoiler: false}
          - {id: post_apocalyptic, group: setting_worldbuilding, spoiler: false}
          - {id: dystopia, group: setting_worldbuilding, spoiler: false}
          - {id: space_opera, group: setting_worldbuilding, spoiler: false}
          - {id: cyberpunk, group: setting_worldbuilding, spoiler: false}
          - {id: multiple_fantasy_species, group: setting_worldbuilding, spoiler: false}
          - {id: dark_academia_setting, group: setting_worldbuilding, spoiler: false}  # distinct tone from magic_school — moodier, more elite institution
          - {id: steampunk, group: setting_worldbuilding, spoiler: false}
          - {id: litrpg_or_progression_fantasy, group: setting_worldbuilding, spoiler: false}  # protagonist reincarnated/transported into a world with explicit game-like stat/level mechanics — a real, sizable subgenre (He Who Fights with Monsters) with no prior vocabulary home
          - {id: new_weird_setting, group: setting_worldbuilding, spoiler: false}  # fantasy/sci-fi blend with pseudo-scientific, industrial-grotesque worldbuilding — Perdido Street Station is the defining example
          - {id: isekai, group: setting_worldbuilding, spoiler: false}  # protagonist transported/reincarnated from their origin world into a different one and generally remains there — distinct from portal_fantasy (classic doorway, often round-trip, no reincarnation/game-system implication) and litrpg_or_progression_fantasy (about game-mechanics presence, not the transportation premise); the two frequently co-occur but neither implies the other
          - {id: renaissance_or_mercantile_setting, group: setting_worldbuilding, spoiler: false}  # Renaissance/early-modern-era analog: merchant city-states, guilds, canals, maritime trade — distinct from medieval_european_setting's feudal-kingdom default (The Lies of Locke Lamora's Camorr, modeled on Renaissance Venice)
          - {id: vampires, group: setting_worldbuilding, spoiler: false}  # the specific creature mythology (turning, bloodlines, sunlight vulnerability, etc.) — distinct from immortal_or_ageless_character (a character trait any long-lived being could have) and monster_or_fae_romance (a romantic pairing, not a general setting element)
          - {id: dragons, group: setting_worldbuilding, spoiler: false}  # dragons as a specific, defining creature/setting element (dragon-riders, dragon-as-companion, dragon-as-threat) — same logic as vampires: a specific mythology readers have strong, independent preferences on, not just "a fantasy creature exists"
          - {id: elves, group: setting_worldbuilding, spoiler: false}  # same logic as vampires/dragons — a specific, common fantasy race readers have real preferences on, including active fatigue with the generic version (Tolkien-derivative elves/dwarves as default worldbuilding furniture) unless given a real twist. Distinct from multiple_fantasy_species (presence of several species generally) — a book can have elves specifically without that being the point, or multiple species without elves being one of them.
          - {id: dwarves, group: setting_worldbuilding, spoiler: false}  # see elves — same rationale, same fatigue pattern
          - {id: fae_or_fairies, group: setting_worldbuilding, spoiler: false}  # plain creature-presence tag, distinct from fae_courts (which specifically covers fae political/court structure as a plot element) — a book can have fae present without court politics being the focus, or vice versa
          - {id: orcs, group: setting_worldbuilding, spoiler: false}  # same rationale as elves/dwarves — a specific, common race with its own fatigue pattern
          - {id: werewolves, group: setting_worldbuilding, spoiler: false}  # split 2026-08-29 from the original werewolves_or_shapeshifters — specifically classic lycanthropy: a curse/bite-transmitted condition tying transformation to something involuntary (moon cycle, rage), a wolf/beast form, often silver-vulnerable or potion-restrained. Distinct from shapeshifters below — readers who want Twilight/Underworld-style werewolf pack drama are a different taste signal from readers who want doppelganger/bodyswap intrigue.
          - {id: shapeshifters, group: setting_worldbuilding, spoiler: false}  # split 2026-08-29 — general voluntary or skill/species-based form-changing not tied to lycanthropy specifically: Animagi, kandra, dopplers, curse-based full transformations (a la Beauty-and-the-Beast retellings), mimicry powers. Distinct from werewolves above (see rationale there) and from immortal_or_ageless_character/multiple_fantasy_species (general traits, not this specific ability)
          - {id: sudden_apocalypse_event, group: setting_worldbuilding, spoiler: false}  # the unfolding, in-progress collapse of civilization itself (Cat's Cradle, Station Eleven) — distinct from post_apocalyptic, which only covers settings after collapse has already happened
          - {id: satirical_or_comedic_fantasy, group: setting_worldbuilding, spoiler: false}  # fantasy as a vehicle for parody of genre/bureaucratic/religious convention (The Colour of Magic, Good Omens) — fantasy-side equivalent of scifi_specific's satirical_or_comedic_scifi, which doesn't fit a book with no sci-fi element
          - {id: crime_family_saga, group: setting_worldbuilding, spoiler: false}  # organized-crime/clan-turf-war structure as the book's defining shape (Jade City) — distinct from court_intrigue (political scheming, not criminal-clan structure) and war_story

          # -- plot devices & structure --
          - {id: epic_quest, group: plot_devices, spoiler: false}
          - {id: long_journey, group: plot_devices, spoiler: false}  # added 2026-08-29 -- the physical journey/travel itself is the narrative's structural spine, chapter-to-chapter movement through geography (The Fellowship of the Ring/The Hobbit -- literally "there and back again"). Distinct from epic_quest, which only requires an important goal/mission and can play out almost entirely in fixed locations (The Way of Kings/Oathbringer have epic_quest but no central journey) -- many books have both, but they're separable signals for a reader who specifically wants travelogue/road-narrative structure vs. one who just wants a high-stakes mission
          - {id: court_intrigue, group: plot_devices, spoiler: false}
          - {id: heist, group: plot_devices, spoiler: false}
          - {id: rebellion_against_empire, group: plot_devices, spoiler: false}
          - {id: time_loop, group: plot_devices, spoiler: false}
          - {id: time_travel, group: plot_devices, spoiler: false}
          - {id: parallel_universe_or_multiverse, group: plot_devices, spoiler: false}
          - {id: prophecy, group: plot_devices, spoiler: false}
          - {id: war_story, group: plot_devices, spoiler: false}
          - {id: ancient_evil_awakens, group: plot_devices, spoiler: false}
          - {id: powerful_artifact_macguffin, group: plot_devices, spoiler: false}
          - {id: last_minute_rescue, group: plot_devices, spoiler: false}
          - {id: black_and_white_morality, group: plot_devices, spoiler: false}  # explicit opposite pole of morally_grey_protagonist
          - {id: child_soldiers_in_warfare, group: plot_devices, spoiler: false}  # children trained/deployed as combatants — Ender's Game's defining premise, distinct from hidden_talent_prodigy (which captures the skill angle, not the weaponized-childhood angle)
          - {id: noir_detective_structure, group: plot_devices, spoiler: false}  # investigation-driven plot with a hardboiled-detective throughline, e.g. Leviathan Wakes' Miller arc
          - {id: deadly_competition_or_trial, group: plot_devices, spoiler: false}  # a formal, life-threatening competition or trial among selected participants (The Hunger Games, the Triwizard Tournament, Divergent's faction initiation) — distinct from war_story (open conflict, not a structured contest) and epic_quest (a journey, not a competition)
          - {id: survivalist_ingenuity, group: plot_devices, spoiler: false}  # solo survival through competence and improvisation against an indifferent environment as the book's central engine (The Martian) — distinct from underdog_rising (a social/status arc, not a survival-skills one)
          - {id: revenge, group: plot_devices, spoiler: false}  # added 2026-08-30 — avenging a specific wrong against a specific target is the protagonist's driving motivation (Red Rising's Darrow avenging Eo, Six of Crows' Kaz against Pekka Rollins, Malice's Corban). Distinct from corruption_arc (a moral trajectory, not a plot motivation — a revenge-driven protagonist isn't necessarily descending into villainy) and black_and_white_morality/war_story (general conflict framing, not a personal vendetta specifically)

          # -- sci-fi specific --
          - {id: first_contact, group: scifi_specific, spoiler: false}
          - {id: generation_ship, group: scifi_specific, spoiler: false}
          - {id: dying_earth, group: scifi_specific, spoiler: false}
          - {id: alien_invasion, group: scifi_specific, spoiler: false}
          - {id: ai_consciousness, group: scifi_specific, spoiler: false}
          - {id: cloning, group: scifi_specific, spoiler: false}
          - {id: terraforming_or_space_colonization, group: scifi_specific, spoiler: false}
          - {id: cryosleep, group: scifi_specific, spoiler: false}
          - {id: mind_uploading_or_digital_immortality, group: scifi_specific, spoiler: false}
          - {id: virtual_reality_or_simulated_world, group: scifi_specific, spoiler: false}  # "life is a simulation" — distinct from cyberpunk, which is a setting
          - {id: ai_uprising_or_rebellion, group: scifi_specific, spoiler: false}  # distinct from ai_consciousness — hostile turn, not just sentience emerging
          - {id: android_or_replicant_rights, group: scifi_specific, spoiler: false}
          - {id: cybernetic_enhancement, group: scifi_specific, spoiler: false}  # about humans augmented with machine parts, distinct from the ai_* entries
          - {id: hive_mind, group: scifi_specific, spoiler: false}
          - {id: mecha_or_giant_robots, group: scifi_specific, spoiler: false}
          - {id: self_replicating_consciousness, group: scifi_specific, spoiler: false}  # one mind copying itself into many autonomous, divergent instances — distinct from mind_uploading_or_digital_immortality, which covers the upload but not the multiplicity (We Are Legion)
          - {id: species_divergence, group: scifi_specific, spoiler: false}  # humanity splits into distinct species over deep time, e.g. Eloi/Morlock — distinct from dystopia, which doesn't capture the speciation shape (The Time Machine)
          - {id: relativistic_time_dilation, group: scifi_specific, spoiler: false}  # near-light travel causes subjective vs. objective time to diverge — distinct from time_loop/time_travel (The Forever War)
          - {id: mutual_human_alien_war, group: scifi_specific, spoiler: false}  # humans and aliens in symmetric expansionist conflict — distinct from alien_invasion, which implies a one-sided attack on human territory (Old Man's War)
          - {id: aging_reversal_or_rejuvenation, group: scifi_specific, spoiler: false}  # elderly protagonist restored to a younger, enhanced body (Old Man's War)
          - {id: satirical_or_comedic_scifi, group: scifi_specific, spoiler: false}  # sci-fi as vehicle for parody/satire of genre or bureaucratic conventions, not just humor_level's amount-of-comedy axis (Hitchhiker's Guide)
          - {id: uplift, group: scifi_specific, spoiler: false}  # a species deliberately or accidentally granted human-level intelligence via technology (Children of Time) — distinct from species_divergence, which covers humanity itself splitting into new species, not a different species being uplifted

          # -- craft & narrative devices --
          - {id: twist_ending, group: craft_devices, spoiler: true}
          - {id: twist_filled, group: craft_devices, spoiler: true}  # multiple reversals throughout, not one ending twist — e.g. The Prestige, vs. twist_ending's Sixth Sense shape
          - {id: sanderlanche, group: craft_devices, spoiler: false}  # converging multi-thread payoff into an intense climax; community term, kept as-is (genre-native)
          - {id: redemption_arc, group: craft_devices, spoiler: true}
          - {id: villain_turns_ally, group: craft_devices, spoiler: true}
          - {id: major_character_death, group: craft_devices, spoiler: true}
          - {id: mentor_death, group: craft_devices, spoiler: true}
          - {id: mythological_retelling, group: craft_devices, spoiler: false}  # a known myth retold/reframed, usually from a different vantage point — a large, currently booming category (Circe, Song of Achilles) with no prior coverage
          - {id: shadow_self_confrontation, group: craft_devices, spoiler: false}  # protagonist must confront and integrate a literal or figurative dark half of themselves — distinct from redemption_arc, which requires prior villainy (A Wizard of Earthsea)
          - {id: corruption_arc, group: craft_devices, spoiler: true}  # a sympathetic or morally-grey protagonist's descent into villainy (The Ballad of Songbirds and Snakes) — the structural opposite of redemption_arc, which only covers the reverse direction
          - {id: mythological_pantheon_as_characters, group: craft_devices, spoiler: false}  # mythological/pantheon figures used as characters within an original, non-retold plot (American Gods) — distinct from mythological_retelling, which implies retelling one specific myth's actual events
          - {id: tragic_reversal_of_fortune, group: craft_devices, spoiler: true}  # a rise-then-tragic-fall arc, most often an enhancement or elevation that proves temporary or costly (Flowers for Algernon) — distinct from underdog_rising, which only covers the rise
          - {id: amnesia_driven_narrative, group: craft_devices, spoiler: false}  # protagonist memory loss/recovery is the structural engine revealing their own backstory to themselves (Project Hail Mary) — distinct from twist_ending/twist_filled, which are reader-facing reversals rather than a self-discovery device

# Series-level spoiler gating (not a schema field — a data-model note).
# Any field with spoiler: true, on a book that belongs to a series, gets a
# companion "reveals at installment N" value stored per book record, e.g.
# book_dna.ending_type_spoiler_horizon = 3. The UI hides the field until
# the reader's tracked progress reaches that installment, or they hit
# "reveal anyway." The recommendation engine always reads the true value
# regardless of horizon or reveal state.

# Series & universe (not a schema field — a data-model note for step 02).
# Membership in a series, and a series' completion status, are relational
# and mutable — they do NOT belong in book_dna as frozen tag data.
#   universe (optional)  — a shared continuity, e.g. "The First Law World"
#     └── series (optional) — a bounded arc within it, e.g. "The First Law"
#           status: ongoing | completed | hiatus  — refreshed from
#           metadata sources periodically, never set once at tagging time
#           book_count: how many books are in it (nullable/estimated
#           while ongoing — e.g. Stormlight's planned 10) — same reasoning
#           as status: a mutable, series-level fact, refreshed from
#           metadata, never frozen at tagging time. This is the "series
#           length" half of the length-as-approachability idea; the
#           per-book half is book_length above — they're independent
#           (few-but-huge volumes vs. many-but-normal-sized ones are both
#           "a lot of commitment," for different reasons).
#         └── book — position_in_series (nullable, may be fractional
#             for novellas/interquels)
#   A book can link to a universe directly without belonging to any one
#   series (e.g. Best Served Cold in the First Law world). Adding a later
#   sequel (The Shining -> Doctor Sleep) means adding a series row and
#   linking both books to it — it never requires re-tagging the earlier
#   book's own book_dna.narrative_closure, which stays whatever it always
#   was.

