# Book DNA schema — machine-readable draft
#
# Status: DRAFT, v0.1 — pending review (see book-dna-decisions.md, "Open for review" --
# moved there from book-dna.md during the 2026-09-25 core/companion-file schema split)
# This is the source of truth to generate, later:
#   - Postgres columns for `book_dna` (step 02 of the roadmap)
#   - the JSON schema handed to the LLM tagging pipeline (step 04)
#   - filter UI + the natural-language assistant's parse targets (step 06)
#
# Conventions:
#   - every field has: type (enum | multi_enum), values, spoiler
#   - spoiler: true means the recommendation engine always reads the real
#     value, but the UI must gate display (see spoiler_horizon note at
#     the bottom for series-level gating)
#   - multi_enum "tropes" carries spoiler per-value, since most tropes are
#     safe and a few specific ones aren't

schema_version: 0.1.0-draft

# Every book gets this regardless of category — the hook that lets a future
# genre module (romance, literary fiction, ...) be new rows + a new
# extension category instead of a schema migration.
genre_field:
  id: genre
  type: multi_enum
  values: [sci_fi, fantasy]  # closed for v1; will open up post-v1
  spoiler: false

# Bibliographic fact, not a taste attribute — but a real, mostly-objective
# axis readers have strong preferences on, independent of genre or any
# DNA field. Added after real user feedback flagged it as a gap (user
# likes The Golden Compass despite a general YA aversion).
age_category_field:
  id: age_category
  type: enum
  values: [middle_grade, ya, new_adult, adult]
  spoiler: false

# Same shape as age_category: a bibliographic fact (derived from page/word
# count, standard metadata from every source in the sourcing plan), not an
# intrinsic taste attribute — but a real axis readers have strong, often
# hard-threshold preferences on, independent of genre/tone/trope. Someone
# avoiding The Wheel of Time isn't reacting to its tropes, they're
# reacting to "14 books"; someone avoiding Stormlight isn't avoiding epic
# fantasy, they're avoiding ~450,000-word individual volumes. Two
# genuinely different axes — this field covers per-book length; series
# length (book_count) lives on the `series` entity instead, see "Series &
# universe" below, since it's a series-level fact, not a book-level one.
# The raw page/word count itself is plain bibliographic data in the
# `books` table; this field is the bucketed version used for similarity
# scoring. Gets the same three-tier treatment as content_warnings/tropes:
# soft signal, informational display, and — likely more load-bearing here
# than for most fields — an explicit opt-in cap ("nothing over 500
# pages" / "no series longer than 6 books"), since approachability is
# often a hard threshold, not a graduated taste.
book_length_field:
  id: book_length
  type: enum
  values: [short, standard, long, epic]
  # Rough guidance, not a hard rule — bucket from actual page/word count:
  # short: under ~350pp / ~100k words. standard: ~350-500pp / 100-140k.
  # long: ~500-700pp / 140-200k. epic: 700pp+ / 200k+ (Stormlight-tier).
  spoiler: false

categories:

  pov_structure:
    label: Point of view & structure
    scope: core
    fields:
      pov_count:
        type: enum
        values: [single, dual, few, several, ensemble]
        # widened 2026-08-29 from a binary single/multiple. User
        # feedback: Kings of Paradise (~3 POVs) and A Game of Thrones
        # (~9 POVs) were both just "multiple" -- real information lost,
        # and it matters for recommendation quality specifically (a
        # reader who likes a few rotating POVs may be overwhelmed by a
        # GRRM-scale ensemble, or vice versa). Buckets: single (1),
        # dual (2), few (3-4), several (5-7), ensemble (8+). This is
        # ordinal now (see recommend.py), not nominal -- a "few" book
        # scores partial similarity to an "ensemble" book instead of a
        # flat match/no-match. Counts recurring, page-time-significant
        # POV characters -- see the deferred exact-count idea below.
        spoiler: false
      person:
        type: enum
        values: [first, second, third_limited, third_omniscient, mixed]
        # mixed = different POV threads use different persons (e.g. The
        # Fifth Season: one thread in 2nd person, others in 3rd) —
        # surfaced by the 30-book pilot; only relevant alongside
        # pov_count: multiple.
        spoiler: false
      narrator_reliability:
        type: enum
        values: [reliable, unreliable, ambiguous]
        spoiler: false
        # ambiguous added 2026-08-31 (external reader feedback, Dungeon Crawler
        # Carl): distinct from unreliable -- unreliable means the text gives
        # readers grounds to believe the narrator is wrong/lying (Fight Club,
        # Gone Girl); ambiguous means the book deliberately withholds the
        # information needed to judge either way, and reasonable readers land
        # on different answers. Don't default to ambiguous for "narrator has a
        # strong voice/bias" -- that's just reliable narration with
        # personality; only use it when the text itself won't resolve the
        # question.
      timeline:
        type: enum
        values: [linear, nonlinear, multi_timeline]
        # multi_timeline replaces the old dual_timeline (was hard-coded to
        # exactly two) — generalizes to any number of interwoven
        # timelines. The similarity math cares whether a book uses this
        # structural device at all, not the exact count.
        spoiler: false
      form:
        type: enum
        values: [standard_prose, epistolary, framing_device, verse, embedded_system_text, script_or_stage_play]
        # embedded_system_text added after the same gap recurred 6+ times
        # across three tagging rounds (He Who Fights with Monsters, The
        # Gate of the Feral Gods, Carl's Doomsday Scenario, Dungeon
        # Crawler Carl, The Butcher's Masquerade, This Inevitable Ruin,
        # The Eye of the Bedlam Bride, The Dungeon Anarchist's Cookbook) —
        # LitRPG's defining structural device (game-notification/stat-
        # block text interleaved with standard narrative prose) had no
        # value at all; every instance was previously force-fit into
        # standard_prose.
        # script_or_stage_play added 2026-08-30, surfaced by Harry Potter
        # and the Cursed Child — a stage-play script (dialogue + stage
        # directions, no narrative prose) had no vocabulary match; every
        # other value assumes some form of prose narration exists.
        spoiler: false
      prose_density:
        type: enum
        values: [sparse, moderate, lush]
        # How much physical/sensory/environmental description the prose
        # carries — sparse (dialogue/action-forward, minimal scene-setting;
        # Sanderson, Six of Crows) vs. lush (extensive immersive detail;
        # The Fellowship of the Ring, The Priory of the Orange Tree, The
        # Name of the Wind). Distinct from worldbuilding_density (how much
        # of the WORLD's lore/rules get explained) — a book can have dense
        # worldbuilding delivered in sparse prose, or light worldbuilding
        # described lushly. User-sourced field: readers have a durable,
        # independent preference on prose texture itself.
        spoiler: false
      prose_complexity:
        type: enum
        values: [accessible, moderate, dense]
        # Vocabulary and sentence-structure difficulty — accessible
        # (commercial-fiction register; most YA, Sanderson, Weir) vs. dense
        # (archaic/elevated vocabulary, complex syntax; Piranesi, Jonathan
        # Strange & Mr Norrell, Frankenstein). Distinct from prose_density
        # (amount of description) — a book can be simply worded but
        # heavily descriptive, or sparse but syntactically demanding.
        # Particularly relevant for an audiobook-native product: dense
        # prose is harder to follow by ear than by eye. User-sourced field.
        spoiler: false

  pacing_tone:
    label: Pacing & tone
    scope: core
    fields:
      overall_pace:
        type: enum
        values: [slow, medium, fast]
        spoiler: false
      pace_shape:
        type: enum
        values: [consistent, slow_burn_to_fast_finish, front_loaded, uneven]
        spoiler: false
      drive:
        type: enum
        values: [character_driven, plot_driven, balanced, worldbuilding_driven, romance_driven]
        # worldbuilding_driven added after the pilot: New Weird-style books
        # (Perdido Street Station) are consistently described as driven by
        # the setting itself, not character/plot/an even split of the two.
        #
        # romance_driven added 2026-09-04 (repo owner's own gap analysis,
        # see docs/scoring-test-protocol.md's 2026-09-04 "structural issues"
        # entry): the existing romance_heat_frequency/romance_heat_intensity
        # fields measure EXPLICITNESS, not narrative centrality -- a book
        # can be romance_heat_frequency: frequent and still have romance as
        # a supporting thread (Wax/Steris in the back half of Mistborn Era
        # 2), or be low-heat and still have the relationship AS the plot
        # (much "clean" romantasy). This value captures specifically when
        # the central relationship(s), not the external plot or a
        # character's individual arc, is what the book is actually about --
        # the direct fantasy-genre analog of contemporary romance's own
        # "central love story" convention. Does NOT capture execution
        # quality/tone (juvenile vs. mature, formulaic vs. earned) -- see
        # `romance_tone` below (content_shape category) for that harder,
        # more subjective axis, added 2026-09-11 after its own validation
        # probe.
        spoiler: false
      darkness:
        type: enum
        values: [light, moderate, dark, grimdark]
        spoiler: false
      humor_level:
        type: enum
        values: [none, light, moderate, heavy]
        spoiler: false
      emotional_register:
        type: enum
        values: [comfort_read, bittersweet, tense, gut_punch]
        spoiler: false
      message_intensity:
        type: enum
        values: [subtle, moderate, heavy_handed]
        # How OVERTLY the book pushes a moral/philosophical argument —
        # deliberately NOT which argument (see the schema's ideological-
        # neutrality decision in book-dna.md). A reader can be averse to
        # heavy-handedness itself regardless of the specific message (e.g.
        # disliking both an overt pacifism theme and an overt religious-
        # redemption theme in different books) — this field lets that
        # generalized aversion be learned from ratings without the schema
        # ever tagging which position a book argues.
        spoiler: false
      intellectual_weight:
        type: enum
        values: [escapist, moderate, cerebral]
        # How much the book invites philosophical/ethical/psychological
        # reflection vs. functions as plot-forward entertainment —
        # escapist (Fourth Wing, Six of Crows, Ready Player One) vs.
        # cerebral (Ender's Game, The Left Hand of Darkness, Never Let Me
        # Go, Flowers for Algernon). Distinct from message_intensity (how
        # OVERTLY a specific argument is pushed — a subtle book can still
        # be cerebral, a heavy-handed one can still be pure escapism) and
        # from darkness (tone, not depth of thought invited). User-sourced
        # field, from the "John Wick is fun but Ender's Game makes you
        # think" distinction.
        spoiler: false

  content_shape:
    label: Content & shape
    scope: core
    fields:
      romance_heat_frequency:
        type: enum
        values: [none, rare, occasional, frequent]
        spoiler: false
      romance_heat_intensity:
        type: enum
        values: [na, closed_door, low, moderate, explicit]
        spoiler: false
      romance_tone:
        type: enum
        values: [understated, melodramatic, mixed]
        # Added 2026-09-11 (schema+backfill: 20260911140000/20260911100000;
        # landed in scoring: commit 7646a1d) -- the execution-QUALITY/tone
        # axis `drive: romance_driven` deliberately doesn't capture (see
        # that field's own comment) -- restrained/grounded emotional
        # PRESENTATION vs. soap-opera-style melodrama, independent of how
        # much romance there is (`drive`), how fast it develops (pacing),
        # whether it's toxic (content_warnings), or its heat level
        # (romance_heat_*). Nullable and left null when a book has too
        # little romantic content to judge -- this is NOT a "none" value
        # on the enum, it's the absence of the field entirely. `mixed` is a
        # real, evidence-backed third value (a genuine tie between both
        # readings, or a short-story collection with both tones across
        # different stories -- e.g. Sword of Destiny), not a default/unsure
        # bucket. See .claude/skills/tag-catalog-batch/SKILL.md's evidence
        # standard for this field before tagging it -- it has a real,
        # already-caught track record of confident-but-wrong tags from
        # pattern-matching genre reputation instead of checking actual
        # scene-level presentation.
        spoiler: false
      violence_frequency:
        type: enum
        values: [none, rare, occasional, frequent]
        spoiler: false
      violence_intensity:
        type: enum
        values: [na, mild, moderate, graphic, brutal]
        # `brutal` added after direct reader comparison across the 30-book
        # pilot corpus: books as different in actual violence experience
        # as The Way of Kings and Kings of Paradise/Prince of Thorns were
        # both landing on `graphic`, the top of a 4-point scale — the same
        # "top bucket absorbing too wide a range" problem `darkness`
        # already solved by adding `grimdark` above `dark`. `brutal` is
        # for extreme, dwelled-upon violence (detailed dismemberment,
        # prolonged torture) — distinct from `graphic`, which still reads
        # as clearly violent but not lingering on extremity.
        spoiler: false
      content_warnings:
        type: multi_enum
        spoiler: false  # neutral data, not editorial — see book-dna.md
        # Each per-book selection also carries TWO per-instance axes below
        # — neither is a fixed property of the vocabulary item (unlike
        # tropes' per-value `spoiler`), since both vary by book, not by
        # warning type. Stored per (book, warning) pair, e.g. a join table
        # in step 02, not baked into the vocabulary list itself.
        value_severity: [brief, moderate, central_theme]
        # How much of the book this warning covers — see book-dna.md.
        value_reveals_spoiler: [false, true]
        # Whether flagging this warning ON THIS BOOK gives away a plot
        # point. Most instances of most warnings are known from the start
        # (false) — but the same warning type can be a late, concealed
        # reveal on a different book (e.g. Perdido Street Station's
        # sexual_assault: Yagharek's crime is hidden until deep in the
        # book). This is why it's per-instance, not a per-value spoiler
        # flag like tropes has: sexual_assault itself isn't inherently a
        # spoiler, this specific book's use of it is. The UI gates display
        # of true=instances the same way any other spoiler field does; the
        # recommendation engine always reads the real value regardless.
        values:
          - sexual_assault
          - dubious_consent
          - self_harm
          - suicide
          - eating_disorder
          - child_death
          - child_abuse
          - animal_harm
          - domestic_abuse
          - substance_abuse
          - torture
          - body_horror
          - hate_speech_depicted
          - ableism_depicted
          - racism_depicted
          - colonization_themes
          - slavery
          - genocide
          - war_trauma
          - religious_trauma_or_cults
          - mental_illness_depiction
          - pregnancy_loss
          - kidnapping_or_captivity
          - sexual_harassment
          - emotional_abuse
          - child_sexual_abuse
          - stalking
          - trafficking
          - classism
          - sexism_or_misogyny_depicted
          - infertility
          - abortion
          - bullying
          - pandemic_or_epidemic
          # added after the remaining-catalog round: Station Eleven's
          # entire premise is civilizational collapse from a fast-moving
          # flu, and neither child_death nor war_trauma fit mass death
          # from disease specifically — a real gap for a subgenre
          # (plague fiction) the catalog will keep encountering.
          - fictional_species_prejudice
          # distinct from racism_depicted (written for real-world-analog
          # prejudice) — covers in-world bigotry against a fantasy
          # species/kind (The Cruel Prince's fae-vs-human contempt, The
          # House in the Cerulean Sea's anti-magical-youth bigotry).
          - incest
          # surfaced by One Hundred Years of Solitude, where it's a
          # recurring, central device (not a single incidental instance) —
          # no existing warning covered it.
          - chronic_illness_or_disability
          # distinct from ableism_depicted (which covers depicted
          # prejudice against a disabled character) — this covers the
          # lived experience of chronic illness/disability itself as a
          # throughline, independent of whether prejudice is also shown
          # (Tomorrow, and Tomorrow, and Tomorrow's Sam).
          - natural_disaster_mass_casualty
          # added 2026-09-13 (catalog-wide gap sweep #2, migration
          # 20260913220000): a natural or astronomical disaster (heat
          # wave, flood, asteroid/lunar-fragment bombardment, etc.)
          # causing mass death as the book's inciting or central event —
          # distinct from war_trauma (human conflict) and
          # pandemic_or_epidemic (disease). First flagged 2026-09-09 on
          # The Ministry for the Future (Kim Stanley Robinson's opening
          # heat-wave mass-death event, previously tagged war_trauma as
          # the nearest imperfect fit), re-checked-but-still-single-
          # occurrence in the 2026-09-13 sweep #1. Promoted this round
          # on TWO independent second occurrences found by different
          # sweep clusters: James Dashner's The Kill Order (catastrophic
          # solar flares causing mass death from heat/fire/flooding) and
          # Neal Stephenson's Seveneves (the Moon shatters, triggering
          # the "Hard Rain" bombardment that kills ~7 billion people).
          # Deliberately named/scoped broadly (NOT "climate_disaster")
          # since neither new evidence book is climate-driven — both are
          # astronomical in origin — so a narrowly climate-scoped name
          # would have missed the actual evidence that promoted it.
      worldbuilding_density:
        type: enum
        values: [light, moderate, dense]
        spoiler: false
      worldbuilding_delivery:
        type: enum
        values: [woven, exposition_dump, mixed]
        # Added 2026-09-11 (same migrations/commit as romance_tone above)
        # -- HOW lore is delivered (in-scene discovery/dialogue vs.
        # narrator/footnote exposition), distinct from worldbuilding_density
        # (how MUCH lore exists). A book can be density: dense and still be
        # woven -- Book of the Ancestor is dense on all 3 books and the
        # cleanest example of woven delivery. Nullable, left null when a
        # book has too little worldbuilding/exposition either way to judge
        # (a light-worldbuilding book has nothing to judge the delivery
        # of) -- not a "none" value on the enum. `mixed` is a real,
        # evidence-backed tie (e.g. Mistborn: The Final Empire, both
        # readings equally weakly attested), not a default/unsure bucket.
        # A book that's confusing because NOTHING is explained (Gideon the
        # Ninth, Gardens of the Moon) is `woven` (or null if genuinely
        # untagged), not `exposition_dump` -- the two failure modes read
        # similarly in reader complaints ("I was lost") but come from
        # opposite delivery mechanisms; read the actual complaint before
        # assuming which axis it's about. See
        # .claude/skills/tag-catalog-batch/SKILL.md's evidence standard.
        spoiler: false
      stakes_scope:
        type: enum
        values: [intimate, regional, global, cosmic]
        # The BREADTH of what's at risk — how large a footprint is
        # threatened, independent of how severe the danger is for any
        # one character. intimate (personal relationships/small cast;
        # Legends & Lattes, The House in the Cerulean Sea, Before the
        # Coffee Gets Cold) → regional (a city/kingdom/single planet;
        # The Lies of Locke Lamora) → global (an entire civilization is
        # at stake, however large that civilization is — this includes
        # galaxy-spanning single-universe empires like Dune, Foundation,
        # or Star Wars, not just one planet) → cosmic (stakes that go
        # beyond one universe/reality entirely: multiverse, alternate
        # dimensions, existential threats to reality itself — Death's
        # End, A Darker Shade of Magic's parallel Londons). Deliberately
        # does NOT capture how dangerous things are for the protagonist
        # personally — see personal_stakes below, added specifically
        # because this field was originally conflating the two (a boy
        # who might get scolded for losing a toy and a man forced by the
        # mafia into a deadly heist are both "intimate" in scope, but
        # obviously not the same book to read). Also distinct from
        # worldbuilding_density (how much lore gets explained, not how
        # big the stakes are) and darkness (tone, not scale) — a cozy,
        # low-stakes book can still be tonally dark, and an epic-stakes
        # book can still be tonally light.
        spoiler: false
      personal_stakes:
        type: enum
        values: [low, moderate, high, life_threatening]
        # How dire the risk is for the protagonist SPECIFICALLY, however
        # big or small the story's scope is. low (The House in the
        # Cerulean Sea, Legends & Lattes — nobody's life is ever on the
        # line) → moderate (Good Omens' immortal protagonists watching
        # the apocalypse approach without personally risking death; The
        # Invisible Life of Addie LaRue, whose curse makes her literally
        # unkillable — her real stake is being forgotten, not dying) →
        # high (real, serious danger short of the story treating death
        # as the live central threat) → life_threatening (Ender's Game,
        # The Lies of Locke Lamora — the protagonist's actual death is a
        # real, present possibility). Added alongside stakes_scope as a
        # deliberate split of what was one field: scope is about breadth
        # (how much of the world is threatened), this is about severity
        # for the protagonist — independent axes (The Time Traveler's
        # Wife and The Green Mile are both intimate in scope but
        # life_threatening; Circe is intimate in scope and only high,
        # not life_threatening, since she's an immortal goddess and her
        # own death was never really the threat).
        spoiler: false
      narrative_closure:
        type: enum
        values: [self_contained, requires_series]
        spoiler: false
        # Intrinsic to the text, stable once published — does THIS book
        # resolve its own plot, or does it require other books to.
        # Series/universe MEMBERSHIP is deliberately not a field here — see
        # "Series & universe" note at the bottom of this file.
      emotional_resolution:
        type: enum
        values: [happy, tragic, ambiguous, bittersweet]
        spoiler: true
      ends_on_cliffhanger:
        type: enum
        values: [resolved, cliffhanger]
        spoiler: true
        # Distinct from narrative_closure (a series-level structural fact:
        # does this book NEED future installments to resolve its arc) and
        # from emotional_resolution above. A book can requires_series with
        # a non-cliffhanger ending (episodic — resolves this installment's
        # immediate conflict, sets up the next without withholding
        # resolution), or emotional_resolution: happy while still ending
        # on a cliffhanger (a personal beat lands even though the external
        # plot is left hanging).

  audiobook_native:
    label: Audiobook-native
    scope: core
    wedge: true
    # Split 2026-08-29 into two tiers after realizing this whole module
    # was 100% untagged across the catalog. Tier A (narrator_cast,
    # audiobook_length, narrator names on `books.narrators`) is ordinary
    # publisher/retailer metadata -- cheap to source, worth completing.
    # Tier B (narrator_performance, narration_pace_vs_prose,
    # accent_authenticity, production_quality) is subjective listening
    # judgment -- how theatrical, how distinct the character voices are,
    # how well the narrator handles the opposite sex, etc. -- data that
    # doesn't exist as ordinary metadata anywhere. The only quasi-reliable
    # existing sources are professional audiobook critics (AudioFile
    # Magazine reviews/Earphones Awards, the Audie Awards) or mining
    # Audible reviews for narrator sentiment, and both have real coverage
    # gaps (most books were never professionally audio-reviewed) plus a
    # genuine sourcing-effort cost, unlike Book DNA content fields which
    # mostly come from reading the book itself. Tier B deliberately
    # deferred -- see project-log.md 2026-08-29 entry.
    fields:
      narrator_performance:
        type: enum
        values: [poor, average, good, excellent]
        spoiler: false
        # Tier B -- deferred, see module-level note above.
      narrator_cast:
        type: enum
        values: [single_narrator, dual_narrator, full_cast, multi_narrator]
        spoiler: false
        # Tier A -- computable from audiobook_editions (array length of
        # narrators on a `standard` row; a `dramatized_full_cast` row is
        # always full_cast regardless of its own narrator count).
        # multi_narrator added 2026-09-21 (migration
        # 20260921070000_add_multi_narrator_value.sql) after the
        # catalog-wide narrator_cast backfill surfaced 21 real books with
        # a genuine 3+-narrator `standard` edition (uniform across every
        # standard edition that book has) -- distinct from full_cast,
        # which specifically means a dramatized production, not just "3+
        # people read this book." Does NOT cover a book with multiple
        # DIFFERENT standard editions carrying different narrator counts
        # (e.g. a 1-narrator edition and a separate 2-narrator edition of
        # the same book) -- that's a genuinely different, still-open data
        # situation (which real narration is "the" narrator_cast?), left
        # NULL, not multi_narrator (35 such books as of 2026-09-21).
      narration_pace_vs_prose:
        type: enum
        values: [matches, slower, faster]
        spoiler: false
        # Tier B -- deferred, see module-level note above.
      accent_authenticity:
        type: enum
        values: [na, poor, adequate, excellent]
        spoiler: false
        # Tier B -- deferred, see module-level note above.
      production_quality:
        type: enum
        values: [basic, standard, high]
        spoiler: false
        # Tier B -- deferred, see module-level note above.
      audiobook_length:
        type: enum
        values: [short, standard, long, epic]
        # Bucketed from actual listening hours, NOT derived from
        # book_length — narration pace means the two can diverge (a
        # deliberate, measured narrator can make a standard-length novel
        # feel long to listen to; a brisk one can do the reverse), and for
        # an audiobook-first product, hours-to-listen is the more relevant
        # approachability signal than page count for a large share of
        # users. Rough guidance: short < 8h, standard 8-15h, long 15-25h,
        # epic 25h+ (Stormlight-tier audiobooks routinely run 45-55h).
        # Skipped for the 30-book pilot corpus along with every other
        # audiobook_native field — not assessable from web research.
        spoiler: false

  tropes_craft:
    label: Tropes & craft
    scope: sff_extension
    genre: [sci_fi, fantasy]
    fields:
      magic_system_hardness:
        type: enum
        values: [hard, soft, none, na]
        # none = a fantasy-genre book that simply has no magic system in
        # it (the concept applies to this genre but isn't present here).
        # na = the concept doesn't apply at all — a pure sci-fi book with
        # no fantasy element (use scifi_hardness instead). Left undefined
        # until the pilot forced an inference — now documented.
        #
        # Tagged per-book based on what THIS BOOK actually reveals to the
        # reader, not omniscient full-series knowledge -- confirmed
        # 2026-08-31 via external reader feedback questioning why The Eye
        # of the World (Wheel of Time book 1) is "soft" when the One
        # Power is a well-defined, rule-based system by later books. It's
        # soft in book 1 specifically because the reader hasn't been
        # shown the rules yet (weaves, the Five Powers, the taint) --
        # channeling is experienced as mysterious, not mechanical, at
        # this point in the story. Checked: every subsequently-tagged WoT
        # book is "hard" (The Great Hunt onward) -- this progression was
        # already being applied consistently, just never written down.
        # Same principle as spoiler gating and Series DNA trajectories:
        # Book DNA reflects the reader's experience of THIS book, not
        # meta-knowledge from the rest of the series.
        spoiler: false
      scifi_hardness:
        type: enum
        values: [hard, soft, na]
        # na = book has no significant sci-fi/tech component (pure fantasy).
        # Direct sci-fi analog to magic_system_hardness: how rigorously the
        # science/tech is explained and grounded in real/plausible physics
        # vs. treated as unexplained narrative furniture (e.g. FTL travel
        # just works). A well-established reader-facing axis that had no
        # equivalent field until this review flagged the gap.
        spoiler: false
      tropes:
        type: multi_enum
        # `group` is doc/UI grouping only — all tropes are one flat
        # controlled vocabulary for the similarity math regardless of
        # group. Groups exist so a filter UI can organize ~95 options
        # instead of showing one long flat checklist.
        #
        # Vocabulary growth is an ongoing practice, not a one-time pass:
        # during real tagging (step 04), when a book's defining device
        # doesn't fit the existing vocabulary, that's a candidate addition
        # — reviewed against the same bar used throughout this schema's
        # review ("does this predict a different recommendation, not just
        # is it a real term") before being added. The 13 entries added
        # after the 30-book pilot (marked with pilot-sourced comments
        # below) are the first real instance of this practice, not a
        # special one-off.
        values:
          # -- character archetypes (protagonist + antagonist) --
          - {id: chosen_one, group: character_archetypes, spoiler: false}
          - {id: reluctant_hero, group: character_archetypes, spoiler: false}
          - {id: anti_hero, group: character_archetypes, spoiler: false}
          - {id: villain_protagonist, group: character_archetypes, spoiler: false}
          - {id: cursed_protagonist, group: character_archetypes, spoiler: false}
          - {id: morally_grey_protagonist, group: character_archetypes, spoiler: false}
          - {id: secret_royalty, group: character_archetypes, spoiler: false}
          - {id: immortal_or_ageless_character, group: character_archetypes, spoiler: false}
          - {id: reincarnated_protagonist, group: character_archetypes, spoiler: false}
          - {id: hidden_talent_prodigy, group: character_archetypes, spoiler: false}  # untrained character suddenly shows exceptional skill — distinct from chosen_one, which is destiny-driven rather than skill-driven
          - {id: coming_of_age, group: character_archetypes, spoiler: false}  # protagonist's growth from childhood/adolescence into adulthood is the book's central arc — distinct from hidden_talent_prodigy and underdog_rising, which are about skill/status arcs, not growing up per se
          - {id: berserker_rage, group: character_archetypes, spoiler: false}  # added 2026-08-29 -- a character whose combat power source is uncontrolled/building rage itself (Logen Ninefingers' "the Bloody-Nine" in The Blade Itself, Kratos-style rage meters) — distinct from anti_hero/morally_grey_protagonist (moral positioning, not a power mechanic) and immortal_or_ageless_character (a trait, not a combat mechanic)
          - {id: wise_mentor, group: character_archetypes, spoiler: false}
          - {id: underdog_rising, group: character_archetypes, spoiler: false}  # powerless-to-strong arc
          - {id: dark_lord_or_evil_overlord, group: character_archetypes, spoiler: false}
          - {id: ghost_sight, group: character_archetypes, spoiler: false}  # protagonist can see/interact with ghosts specifically — Ninth House; distinct from telepathic_animal_bond (a different, non-human bond) and immortal_or_ageless_character (a trait, not a perceptual ability)
          - {id: animated_construct_companion, group: character_archetypes, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #3, migration 20260913230000): a significant character is an animate being made of inanimate, non-biological material (straw, metal, stone, fire) rather than flesh, portrayed with full personhood/feelings/agency. Evidence: The Wonderful Wizard of Oz (the Scarecrow, the Tin Woodman), Howl's Moving Castle (Calcifer the fire demon; Turnip-head the animate scarecrow), The Neverending Story (Pyornkrachzark the Rockbiter, made of living stone). Distinct from shapeshifters (no form-change occurs, these remain constructs), telepathic_animal_bond (not biological, not a bond mechanic), multiple_fantasy_species (broad worldbuilding-diversity tag, not this specific animation mechanism), and mecha_or_giant_robots/ai_consciousness/android_or_replicant_rights (sci-fi/technological, not magical animation).

          # -- romance & relationships --
          - {id: enemies_to_lovers, group: romance_relationships, spoiler: false}
          - {id: friends_to_lovers, group: romance_relationships, spoiler: false}
          - {id: forbidden_love, group: romance_relationships, spoiler: false}
          - {id: love_triangle, group: romance_relationships, spoiler: false}
          - {id: fated_mates, group: romance_relationships, spoiler: false}
          - {id: soulmate_bond, group: romance_relationships, spoiler: false}
          - {id: arranged_marriage, group: romance_relationships, spoiler: false}
          - {id: marriage_of_convenience, group: romance_relationships, spoiler: false}
          - {id: fake_dating, group: romance_relationships, spoiler: false}
          - {id: forced_proximity, group: romance_relationships, spoiler: false}
          - {id: only_one_bed, group: romance_relationships, spoiler: false}
          - {id: age_gap_romance, group: romance_relationships, spoiler: false}
          - {id: second_chance_romance, group: romance_relationships, spoiler: false}
          - {id: grumpy_sunshine, group: romance_relationships, spoiler: false}
          # distinct from pace_shape.slow_burn_to_fast_finish, which is
          # overall plot pacing — this is specifically the romance subplot
          - {id: slow_burn_romance, group: romance_relationships, spoiler: false}
          - {id: found_family, group: romance_relationships, spoiler: false}
          - {id: monster_or_fae_romance, group: romance_relationships, spoiler: false}
          - {id: insta_love, group: romance_relationships, spoiler: false}  # structural opposite of slow_burn_romance
          - {id: hidden_identity_romance, group: romance_relationships, spoiler: false}  # love interest conceals true nature — broader than secret_royalty (could be a spy, a god, a monster)
          - {id: reverse_harem_or_why_choose, group: romance_relationships, spoiler: false}  # relationship STRUCTURE (one protagonist, multiple love interests, no forced choice), not just flavor
          - {id: telepathic_animal_bond, group: romance_relationships, spoiler: false}  # non-romantic bond, grouped alongside found_family per that precedent — e.g. Robin Hobb's Wit, His Dark Materials' daemons; surfaced by the 30-book pilot (Assassin's Apprentice)
          - {id: sapphic_romance, group: romance_relationships, spoiler: false}  # added 2026-09-05 (catalog-wide gap sweep, migration 20260905140000): a female-female romantic relationship as a central or significant thread — Gideon the Ninth, One Last Stop, The Once and Future Witches, The Priory of the Orange Tree shared zero trope-level signal for this despite it being a real, recognizable reader-facing axis (a reader seeking sapphic romance specifically wasn't discoverable via any existing tag). Split from a combined queer-romance concept into this plus mlm_romance below rather than one value, per the sweep's own recommendation — the two are different reader-taste signals, not interchangeable.
          - {id: mlm_romance, group: romance_relationships, spoiler: false}  # added 2026-09-05 (same sweep/migration as sapphic_romance above) — a male-male romantic relationship as a central or significant thread (Carry On, The Song of Achilles, The House in the Cerulean Sea, Under the Whispering Door). See sapphic_romance for why this is a separate value rather than one combined queer_romance tag.

          # -- setting & worldbuilding --
          - {id: magic_school, group: setting_worldbuilding, spoiler: false}
          - {id: portal_fantasy, group: setting_worldbuilding, spoiler: false}
          - {id: medieval_european_setting, group: setting_worldbuilding, spoiler: false}
          - {id: non_european_inspired_setting, group: setting_worldbuilding, spoiler: false}
          - {id: lost_civilizations, group: setting_worldbuilding, spoiler: false}
          - {id: fae_courts, group: setting_worldbuilding, spoiler: false}
          - {id: high_fantasy_setting, group: setting_worldbuilding, spoiler: false}
          - {id: urban_fantasy_setting, group: setting_worldbuilding, spoiler: false}
          - {id: post_apocalyptic, group: setting_worldbuilding, spoiler: false}
          - {id: dystopia, group: setting_worldbuilding, spoiler: false}
          - {id: space_opera, group: setting_worldbuilding, spoiler: false}
          - {id: cyberpunk, group: setting_worldbuilding, spoiler: false}
          - {id: multiple_fantasy_species, group: setting_worldbuilding, spoiler: false}
          - {id: dark_academia_setting, group: setting_worldbuilding, spoiler: false}  # distinct tone from magic_school — moodier, more elite institution
          - {id: steampunk, group: setting_worldbuilding, spoiler: false}
          - {id: litrpg_or_progression_fantasy, group: setting_worldbuilding, spoiler: false}  # protagonist reincarnated/transported into a world with explicit game-like stat/level mechanics — a real, sizable subgenre (He Who Fights with Monsters) with no prior vocabulary home
          - {id: new_weird_setting, group: setting_worldbuilding, spoiler: false}  # fantasy/sci-fi blend with pseudo-scientific, industrial-grotesque worldbuilding — Perdido Street Station is the defining example
          - {id: isekai, group: setting_worldbuilding, spoiler: false}  # protagonist transported/reincarnated from their origin world into a different one and generally remains there — distinct from portal_fantasy (classic doorway, often round-trip, no reincarnation/game-system implication) and litrpg_or_progression_fantasy (about game-mechanics presence, not the transportation premise); the two frequently co-occur but neither implies the other
          - {id: renaissance_or_mercantile_setting, group: setting_worldbuilding, spoiler: false}  # Renaissance/early-modern-era analog: merchant city-states, guilds, canals, maritime trade — distinct from medieval_european_setting's feudal-kingdom default (The Lies of Locke Lamora's Camorr, modeled on Renaissance Venice)
          - {id: vampires, group: setting_worldbuilding, spoiler: false}  # the specific creature mythology (turning, bloodlines, sunlight vulnerability, etc.) — distinct from immortal_or_ageless_character (a character trait any long-lived being could have) and monster_or_fae_romance (a romantic pairing, not a general setting element)
          - {id: dragons, group: setting_worldbuilding, spoiler: false}  # dragons as a specific, defining creature/setting element (dragon-riders, dragon-as-companion, dragon-as-threat) — same logic as vampires: a specific mythology readers have strong, independent preferences on, not just "a fantasy creature exists"
          - {id: elves, group: setting_worldbuilding, spoiler: false}  # same logic as vampires/dragons — a specific, common fantasy race readers have real preferences on, including active fatigue with the generic version (Tolkien-derivative elves/dwarves as default worldbuilding furniture) unless given a real twist. Distinct from multiple_fantasy_species (presence of several species generally) — a book can have elves specifically without that being the point, or multiple species without elves being one of them.
          - {id: dwarves, group: setting_worldbuilding, spoiler: false}  # see elves — same rationale, same fatigue pattern
          - {id: fae_or_fairies, group: setting_worldbuilding, spoiler: false}  # plain creature-presence tag, distinct from fae_courts (which specifically covers fae political/court structure as a plot element) — a book can have fae present without court politics being the focus, or vice versa
          - {id: orcs, group: setting_worldbuilding, spoiler: false}  # same rationale as elves/dwarves — a specific, common race with its own fatigue pattern
          - {id: werewolves, group: setting_worldbuilding, spoiler: false}  # split 2026-08-29 from the original werewolves_or_shapeshifters — specifically classic lycanthropy: a curse/bite-transmitted condition tying transformation to something involuntary (moon cycle, rage), a wolf/beast form, often silver-vulnerable or potion-restrained. Distinct from shapeshifters below — readers who want Twilight/Underworld-style werewolf pack drama are a different taste signal from readers who want doppelganger/bodyswap intrigue.
          - {id: shapeshifters, group: setting_worldbuilding, spoiler: false}  # split 2026-08-29 — general voluntary or skill/species-based form-changing not tied to lycanthropy specifically: Animagi, kandra, dopplers, curse-based full transformations (a la Beauty-and-the-Beast retellings), mimicry powers. Distinct from werewolves above (see rationale there) and from immortal_or_ageless_character/multiple_fantasy_species (general traits, not this specific ability)
          - {id: sudden_apocalypse_event, group: setting_worldbuilding, spoiler: false}  # the unfolding, in-progress collapse of civilization itself (Cat's Cradle, Station Eleven) — distinct from post_apocalyptic, which only covers settings after collapse has already happened
          - {id: satirical_or_comedic_fantasy, group: setting_worldbuilding, spoiler: false}  # fantasy as a vehicle for parody of genre/bureaucratic/religious convention (The Colour of Magic, Good Omens) — fantasy-side equivalent of scifi_specific's satirical_or_comedic_scifi, which doesn't fit a book with no sci-fi element
          - {id: crime_family_saga, group: setting_worldbuilding, spoiler: false}  # organized-crime/clan-turf-war structure as the book's defining shape (Jade City) — distinct from court_intrigue (political scheming, not criminal-clan structure) and war_story
          - {id: alternate_history, group: setting_worldbuilding, spoiler: false}  # added 2026-09-05 (catalog-wide gap sweep, migration 20260905140000): a real historical era/setting diverging from actual history via a speculative premise woven into that real history (Babel's magic-powered British Empire, His Majesty's Dragon's Napoleonic Wars fought with dragon aircorps, Jonathan Strange & Mr Norrell's magic-infused Regency England, The Man in the High Castle's Axis-victory WWII) — distinct from high_fantasy_setting/medieval_european_setting (invented secondary worlds, not our own history diverging from a real point), and from time_travel (a plot mechanism, not a setting premise)
          - {id: post_scarcity_utopia, group: setting_worldbuilding, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep, migration 20260913170000): a society where advanced (often AI-run) technology has eliminated material scarcity and want, removing conventional economic/survival stakes from character motivation — Iain M. Banks's Culture novels (Consider Phlebas, The Player of Games, Use of Weapons, Excession, Look to Windward, Matter, Surface Detail) and Becky Chambers's Monk & Robot duology (A Psalm for the Wild-Built, A Prayer for the Crown-Shy). Not ai_consciousness (only notes an AI character/entity exists, says nothing about society-wide structure), not dystopia (opposite valence — no prior "utopia" value existed), and not space_opera (describes scale/adventure, not economic structure — plenty of space opera in this catalog is scarcity-driven).
          - {id: flintlock_fantasy_setting, group: setting_worldbuilding, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #2, migration 20260913220000): a fantasy setting in a gunpowder/early-industrial era where firearms (muskets, cannons, revolvers) are a defining part of the world's technology and often its magic system itself. Evidence: Brian McClellan's Powder Mage series (Promise of Blood, The Crimson Campaign, The Autumn Republic, Forsworn -- Powder Mages' magic is literally fueled by igniting black powder; Napoleonic-war-analog setting) and Brandon Sanderson's Mistborn Era Two (The Alloy of Law, Shadows of Self, The Bands of Mourning, The Lost Metal -- revolvers and Allomancy-charged ammunition central to both tech and magic, trains, early electrification) -- none of the 4 Mistborn Era Two books carried any setting-group tag at all before this. Distinct from steampunk (steam/clockwork-tech aesthetic, not firearms-centric) and renaissance_or_mercantile_setting (pre-industrial trade-era focus, confirmed by that value's own origin story -- The Lies of Locke Lamora, a gunless mercantile city-state; only 1 of the 4 Powder Mage books carried it, an inconsistent fit for what should read as one consistent setting).
          - {id: impossible_or_non_euclidean_architecture, group: setting_worldbuilding, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #3, migration 20260913230000): a building/structure whose interior physically defies its exterior dimensions or ordinary geometry -- larger, deeper, or containing more rooms/passages than it should, often shifting or extending indefinitely -- and this spatial impossibility is itself a central plot/horror engine, not incidental set-dressing. Evidence: House of Leaves (the Navidson house's interior is measurably larger than its exterior; a door opens onto a vast, shifting labyrinth), The Library at Mount Char (the Library's rooms function as doors onto other planets/eras, effectively infinite extent), Acceptance (Area X's Tower/Tunnel spirals downward with inconsistent depth exceeding what the terrain allows). Distinct from new_weird_setting (broad genre-atmosphere marker, not this specific mechanism), cosmic_horror (dread from cosmic insignificance generally, not spatial impossibility), and parallel_universe_or_multiverse/portal_fantasy (travel between distinct worlds, not one structure's own wrong internal geometry).
          - {id: secret_magical_bureaucracy, group: setting_worldbuilding, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #3, migration 20260913230000): the protagonist works within a hidden, institutionalized government agency/police branch -- complete with rank, hierarchy, procedure, and payroll -- whose explicit job is monitoring and managing the supernatural within an otherwise mundane real world. Evidence: Rivers of London (Peter Grant recruited as a constable into "the Folly," a formal branch of the Metropolitan Police handling magic, with apprenticeship/budgets/procedure) and The Rook (Myfanwy Thomas belongs to the Checquy Group, a centuries-old secret institution with a chess-piece bureaucratic hierarchy, HR, and office politics). Distinct from urban_fantasy_setting (general "magic hidden in the real world" setting tag, doesn't capture the institutional/bureaucratic employment structure -- notably, The Rook isn't even tagged urban_fantasy_setting despite the fit), infiltration_or_undercover_plot (protagonists here operate openly as members, not undercover), and government_experimentation_on_the_gifted (the government acting ON the gifted adversarially, not the protagonist BEING the institution's agent).
          - {id: old_faith_displaced_by_new_religion, group: setting_worldbuilding, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #3, migration 20260913230000): an old, animistic/nature-based folk religion is visibly losing power as an organized (often monotheistic) religion spreads through the same population, and this religious power-shift -- not external conquest -- directly drives the plot. Evidence: The Bear and the Nightingale (the household/nature spirits protecting Vasya's village weaken as Orthodox preaching stops villagers from leaving offerings, letting a dormant evil resurge) and The Mists of Avalon (the pagan Goddess religion of Avalon recedes from the mundane world as Christianity supplants belief in the old gods, narrated from the losing side's perspective). Distinct from colonization_themes (CW; literal external conquest/colonial dynamics -- neither book involves an invading foreign power, it's an internal religious shift within the same population), mythological_pantheon_as_characters (Avalon isn't tagged with this -- its gods aren't active characters the way some other books' are; the shared device is the DECLINE mechanism, not "gods as characters"), and religious_trauma_or_cults (CW; individual trauma from a cult/upbringing, not a societal faith-succession plot engine).
          - {id: state_mandated_body_harvesting_or_modification, group: setting_worldbuilding, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #3, migration 20260913230000): the ruling power practices forced, magically-enabled harvesting or alteration of its own subjects' bodies (as tribute, tax, or judicial punishment) as a routine instrument of political/military control -- a systemic feature of governance, not incidental monster-horror. Evidence: The Bone Shard Daughter (the Emperor's shard magic requires bone shards involuntarily taken from children as tribute, powering construct-soldiers, with shard sickness as a hidden cost) and Perdido Street Station (New Crobuzon's judicial punishment of "Remaking" -- biothaumaturgic surgery grafting mismatched parts onto convicts, creating a permanent underclass). Distinct from body_horror (CW; generic visceral/grotesque-transformation content warning, doesn't capture the state-as-harvester angle), slavery (CW; Bone Shard's tribute-children keep their freedom -- a tax/tribute system, not ownership), government_experimentation_on_the_gifted (that trope targets people who already have powers; here ordinary citizens/convicts are targeted and the harvested material, not the person, is exploited), and cybernetic_enhancement (implies voluntary/beneficial tech augmentation).
          - {id: caste_or_faction_stratified_society, group: setting_worldbuilding, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #3, migration 20260913230000): a society openly organized around a small number of rigid, named castes/factions that determine identity/role/resources, typically introduced via a formal sorting/testing/assignment mechanism, distinct from generic authoritarian oppression with no such formalized stratification. PROMOTED from sweep #2's single-occurrence tracker (flagged 2026-09-13 with real cross-author evidence -- Divergent, Red Rising, The Selection, Empire of Silence -- but deliberately not promoted that round on a genuine self-flagged risk that it would just co-occur with the existing dystopia tag catalog-wide rather than discriminating a real subset of it) on two things found this round: a genuine new confirming instance (Brave New World's Alpha/Beta/Gamma/Delta/Epsilon castes, assigned via the Bokanovsky Process -- even more explicitly named/rigid than Divergent's factions, despite prenatal rather than ceremony-based assignment) AND, critically, real discriminating counter-evidence resolving sweep #2's exact concern: Battle Royale and The Knife of Never Letting Go are both dystopia-tagged with NO caste/faction-sorting mechanism at all, proving the trope does not simply shadow dystopia catalog-wide.

          # -- plot devices & structure --
          - {id: epic_quest, group: plot_devices, spoiler: false}
          - {id: long_journey, group: plot_devices, spoiler: false}  # added 2026-08-29 -- the physical journey/travel itself is the narrative's structural spine, chapter-to-chapter movement through geography (The Fellowship of the Ring/The Hobbit -- literally "there and back again"). Distinct from epic_quest, which only requires an important goal/mission and can play out almost entirely in fixed locations (The Way of Kings/Oathbringer have epic_quest but no central journey) -- many books have both, but they're separable signals for a reader who specifically wants travelogue/road-narrative structure vs. one who just wants a high-stakes mission
          - {id: court_intrigue, group: plot_devices, spoiler: false}
          - {id: heist, group: plot_devices, spoiler: false}
          - {id: rebellion_against_empire, group: plot_devices, spoiler: false}
          - {id: time_loop, group: plot_devices, spoiler: false}
          - {id: time_travel, group: plot_devices, spoiler: false}
          - {id: parallel_universe_or_multiverse, group: plot_devices, spoiler: false}
          - {id: prophecy, group: plot_devices, spoiler: false}
          - {id: war_story, group: plot_devices, spoiler: false}
          - {id: ancient_evil_awakens, group: plot_devices, spoiler: false}
          - {id: powerful_artifact_macguffin, group: plot_devices, spoiler: false}
          - {id: last_minute_rescue, group: plot_devices, spoiler: false}
          - {id: black_and_white_morality, group: plot_devices, spoiler: false}  # explicit opposite pole of morally_grey_protagonist
          - {id: child_soldiers_in_warfare, group: plot_devices, spoiler: false}  # children trained/deployed as combatants — Ender's Game's defining premise, distinct from hidden_talent_prodigy (which captures the skill angle, not the weaponized-childhood angle)
          - {id: noir_detective_structure, group: plot_devices, spoiler: false}  # investigation-driven plot with a hardboiled-detective throughline, e.g. Leviathan Wakes' Miller arc
          - {id: infiltration_or_undercover_plot, group: plot_devices, spoiler: false}  # added 2026-09-05 (catalog-wide gap sweep, migration 20260905140000): a character deliberately adopts a false identity/persona to infiltrate an enemy organization, institution, or social class as the plot's driving mechanism (City of Stairs, Crooked Kingdom, Mistborn: The Final Empire, Red Rising, The Lies of Locke Lamora, The Traitor Baru Cormorant, Tigana) — distinct from heist (a bounded theft/job, though the two often co-occur) and court_intrigue (scheming among people already occupying their real position, not a false one). Requires the character to actually BE undercover, not just discover an existing hidden faction — Babel was deliberately excluded during the sweep on exactly this distinction (Robin uncovers an already-embedded resistance cell rather than adopting a false identity himself).
          - {id: multi_generational_saga, group: plot_devices, spoiler: false}  # added 2026-09-05 (catalog-wide gap sweep, migration 20260905140000): the story spans multiple generations of a family, dynasty, or civilization, following descendants across decades or centuries (the Foundation series, the Jade City trilogy, One Hundred Years of Solitude, Fire & Blood, Weyward) — distinct from retrospective_memoir_narration (one narrator's own past, not a multi-generational cast) and from series-level facts like series.book_count (this is a single book's or series' own internal timescale, not how many books it takes to read)
          - {id: government_experimentation_on_the_gifted, group: plot_devices, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep, migration 20260913170000): a clandestine government/institutional agency abducts and holds captive people (often children) with innate psychic/supernatural abilities specifically to study, control, or weaponize those powers (Stephen King's Firestarter and The Institute). Distinct from hidden_talent_prodigy (a character trait, no institutional-capture element), kidnapping_or_captivity (a content warning about depicted harm, not this subgenre-defining plot mechanism), and child_soldiers_in_warfare (open conscription into war, not covert experimentation).
          - {id: forced_psychological_reconditioning, group: plot_devices, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #3, migration 20260913230000): a totalitarian state captures a protagonist who has committed an act of individual dissent/rebellion and subjects them to a deliberate, named medical or psychological procedure (not mere imprisonment, propaganda, or punishment) explicitly engineered to strip their capacity for independent thought/free will and force ideological conformity -- and the procedure succeeds by the narrative's end. Evidence: 1984 (Winston's Room 101 reconditioning, ending with him loving Big Brother), A Clockwork Orange (Alex's Ludovico Technique, an aversion-therapy procedure removing his capacity to choose violence), We (D-503's Great Operation/fantasiectomy, surgically removing the imagination that enabled his rebellion). Distinct from dystopia (generic oppressive-setting tag present on all three, doesn't capture the specific mechanism), corruption_arc (a protagonist's own gradual moral decline through choices -- the opposite of an externally imposed procedure), and government_experimentation_on_the_gifted (implies people with special/superhuman abilities, not a corrective procedure applied to an ordinary dissident).
          - {id: mass_unexplained_sensory_or_memory_loss, group: plot_devices, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #3, migration 20260913230000): an inexplicable, population-wide loss of a specific human faculty (sight, or memory/knowledge of specific things) sweeps a society with no clear physical cause, and the loss itself -- not violence, disease-as-death, or invasion -- is the book's central speculative engine and source of societal collapse/control. Evidence: Blindness (a sudden, spreading epidemic of "white blindness" with no medical cause; the entire premise proceeds from the loss of sight itself) and The Memory Police (the regime enforces the vanishing of objects and the population's memories of them in tandem, as the direct instrument of authoritarian control). Distinct from sudden_apocalypse_event (a catch-all for any sudden catastrophe -- pandemic, invasion, nuclear war -- doesn't capture that the specific mechanism is loss of a faculty; also Memory Police isn't even sudden, it's a slow enforced erasure), dystopia (too generic, describes political shape not mechanism), and pandemic_or_epidemic (CW; implies a transmissible illness with physical symptoms/death -- neither book frames it that way, no virus, no visible physical harm beyond the loss itself).
          - {id: modern_knowledge_as_power_source, group: plot_devices, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #3, migration 20260913230000): the protagonist's real-world, non-magical, mundane professional/practical knowledge (not innate talent, not a system-granted stat/class) is the literal mechanism by which they gain an edge in a new/fantastical world. Evidence: Off to Be the Wizard (Martin Banks's IT/support-technician troubleshooting skills let him "hack" reality's editable database file and pose as a wizard in medieval England -- the book's entire explicit premise) and The Wandering Inn (Erin Solstice, an isekai'd American teenager, builds her standing as an innkeeper substantially on modern-world knowledge unavailable in-setting -- recipes, board-game tactics, basic business sense -- not a granted stat or discovered latent talent). Distinct from isekai (only tags the transportation mechanism, not the power source -- many isekai protagonists get power from stats/systems instead), hidden_talent_prodigy (an innate/latent gift being revealed, the opposite of mundane learned knowledge), and litrpg_or_progression_fantasy (the game-mechanic leveling structure; Off to Be the Wizard isn't LitRPG at all, no stat screens, form: standard_prose -- crossing that line is exactly why this is worth tagging separately).
          - {id: monster_hunter_for_hire, group: plot_devices, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #2, migration 20260913220000): protagonist's defining narrative structure is a paid, episodic profession -- taking discrete contracts to hunt/kill a specific named monster/threat for coin, town to town -- rather than one continuous journey or an investigative mystery. First flagged sweep #1 as single-occurrence (Andrzej Sapkowski's Witcher -- The Last Wish, Sword of Destiny); promoted this round on a genuine second occurrence, cross-genre (medieval fantasy -> urban fantasy): Ilona Andrews's Kate Daniels (Magic Bites, Magic Burns) -- a freelance mercenary/Order-contracted investigator taking paid jobs eliminating specific magical threats in post-Shift Atlanta. Distinct from noir_detective_structure (already tagged on both Kate Daniels books) -- that captures narrative voice/investigation structure; this captures the plot-generating JOB mechanism (contracts, payment, episodic creature-of-the-book), which plenty of noir-structured books don't have at all.
          - {id: underworld_descent_journey, group: plot_devices, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #2, migration 20260913220000): protagonist(s) physically travel into the literal land of the dead/underworld/hell to rescue a person or retrieve something, and must find a way back to the world of the living -- the classical katabasis structure. Evidence: R.F. Kuang's Katabasis (two Cambridge magicians descend through a literal eight-circle Hell), Rick Riordan's The Lightning Thief (Percy enters the actual Underworld to confront Hades) and The House Of Hades (Percy/Annabeth traverse Tartarus). The only tag shared across all three was epic_quest, too broad to discriminate (applies to most fantasy quests, underworld or not). Distinct from mythological_retelling (not about retelling one specific myth's events) and from epic_quest/long_journey (generic travel, not specifically to the land of the dead).
          - {id: closed_circle_mystery, group: plot_devices, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #2, migration 20260913220000): a murder/mystery investigation confined to a small, fixed cast of suspects trapped together in an isolated setting (estate, island, fortress, ship) with no way to leave or bring in outsiders until the killer is found. Evidence: Stuart Turton's The 7 1/2 Deaths of Evelyn Hardcastle (guests trapped at Blackheath House) and The Last Murder at the End of the World (isolated island, apocalyptic barrier prevents departure), Tamsyn Muir's Gideon the Ninth (necromancer houses summoned to isolated Canaan House, picked off one by one). Distinct from noir_detective_structure (broader -- doesn't require an isolated/fixed cast; Alastair Reynolds's Chasm City and P. Djeli Clark's A Master of Djinn both carry noir_detective_structure without being closed-circle) -- the isolation-with-no-exit constraint is the discriminating signal noir_detective_structure alone doesn't capture.
          - {id: engineered_creation_escapes_control, group: plot_devices, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #2, migration 20260913220000): a scientifically-created organism/system (cloned creature, self-replicating nanotech, synthetic biology) breaches human containment and turns on its creators/handlers, driven by institutional hubris/negligence rather than any character's personal malice or a designed AI's intentional revolt. Evidence: Michael Crichton's Jurassic Park (cloned dinosaurs breach containment when park systems fail), Prey (self-replicating nanobot swarm evolves emergent intelligence and escapes the lab), and The Lost World (cloning containment failure again) -- zero trope overlap between Jurassic Park (cloning, last_minute_rescue, major_character_death) and Prey (ai_consciousness, corruption_arc, hive_mind, survivalist_ingenuity, twist_ending) despite sharing this exact mechanism. Distinct from ai_uprising_or_rebellion (a designed AI's deliberate, self-aware revolt -- notably NOT applied to Prey's swarm, whose threat is emergent/evolutionary rather than an intentional uprising, confirming this is a separate axis), cloning (the technology alone, not the disaster-plot structure), and sudden_apocalypse_event (catalog-scale civilizational collapse; Crichton's disasters are localized to one island/lab). See also creation_turns_on_creator below for the related-but-distinct Gothic/personal register of the same broad "hubris punished by one's own creation" theme.
          - {id: royal_suitor_selection_competition, group: romance_relationships, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #2, migration 20260913220000): a formalized, multi-contestant competition (trials, interviews, public elimination rounds) in which eligible candidates compete for the right to marry a monarch/royal heir -- distinct from a single pre-decided union. Evidence: Kiera Cass's Selection trilogy (The Selection/The Elite/The One -- the titular Selection process, 35 girls, weekly eliminations, broadcast reality-TV format) and Victoria Aveyard's Red Queen (the in-world "Queenstrial," Silver-blooded women publicly demonstrating powers to be considered as a bride for the prince). Distinct from arranged_marriage (single decided union, no multi-candidate process), love_triangle (romantic entanglement, not a structured competition), deadly_competition_or_trial (explicitly lethal-stakes; this competition isn't fight-to-the-death), and court_intrigue/forced_proximity (adjacent, frequently co-occurring, but neither captures the formal selection-competition structure itself).
          - {id: magically_binding_bargain, group: plot_devices, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep, migration 20260913170000): protagonist enters a supernatural contract/pact with a powerful entity, receiving power or salvation in exchange for costly, enforced ongoing obligations that drive later plot — Jim Butcher's Dresden Files (Harry's deal with Queen Mab to become her Winter Knight, made in Changes and driving Cold Days/Skin Game/Peace Talks) and Sarah J. Maas's A Court of Thorns and Roses/A Court of Mist and Fury (Feyre's bargain with Rhysand). Distinct from fated_mates/soulmate_bond (biological/mystical destiny, not a negotiated transaction), arranged_marriage (a marriage-specific social contract), and prophecy (a foretold event, not a negotiated exchange with enforced terms).
          - {id: deadly_competition_or_trial, group: plot_devices, spoiler: false}  # a formal, life-threatening competition or trial among selected participants (The Hunger Games, the Triwizard Tournament, Divergent's faction initiation) — distinct from war_story (open conflict, not a structured contest) and epic_quest (a journey, not a competition)
          - {id: survivalist_ingenuity, group: plot_devices, spoiler: false}  # solo survival through competence and improvisation against an indifferent environment as the book's central engine (The Martian) — distinct from underdog_rising (a social/status arc, not a survival-skills one)
          - {id: revenge, group: plot_devices, spoiler: false}  # added 2026-08-30 — avenging a specific wrong against a specific target is the protagonist's driving motivation (Red Rising's Darrow avenging Eo, Six of Crows' Kaz against Pekka Rollins, Malice's Corban). Distinct from corruption_arc (a moral trajectory, not a plot motivation — a revenge-driven protagonist isn't necessarily descending into villainy) and black_and_white_morality/war_story (general conflict framing, not a personal vendetta specifically)

          # -- sci-fi specific --
          - {id: first_contact, group: scifi_specific, spoiler: false}
          - {id: generation_ship, group: scifi_specific, spoiler: false}
          - {id: dying_earth, group: scifi_specific, spoiler: false}
          - {id: alien_invasion, group: scifi_specific, spoiler: false}
          - {id: ai_consciousness, group: scifi_specific, spoiler: false}
          - {id: cloning, group: scifi_specific, spoiler: false}
          - {id: terraforming_or_space_colonization, group: scifi_specific, spoiler: false}
          - {id: cryosleep, group: scifi_specific, spoiler: false}
          - {id: mind_uploading_or_digital_immortality, group: scifi_specific, spoiler: false}
          - {id: virtual_reality_or_simulated_world, group: scifi_specific, spoiler: false}  # "life is a simulation" — distinct from cyberpunk, which is a setting
          - {id: ai_uprising_or_rebellion, group: scifi_specific, spoiler: false}  # distinct from ai_consciousness — hostile turn, not just sentience emerging
          - {id: android_or_replicant_rights, group: scifi_specific, spoiler: false}
          - {id: cybernetic_enhancement, group: scifi_specific, spoiler: false}  # about humans augmented with machine parts, distinct from the ai_* entries
          - {id: hive_mind, group: scifi_specific, spoiler: false}
          - {id: mecha_or_giant_robots, group: scifi_specific, spoiler: false}
          - {id: self_replicating_consciousness, group: scifi_specific, spoiler: false}  # one mind copying itself into many autonomous, divergent instances — distinct from mind_uploading_or_digital_immortality, which covers the upload but not the multiplicity (We Are Legion)
          - {id: species_divergence, group: scifi_specific, spoiler: false}  # humanity splits into distinct species over deep time, e.g. Eloi/Morlock — distinct from dystopia, which doesn't capture the speciation shape (The Time Machine)
          - {id: relativistic_time_dilation, group: scifi_specific, spoiler: false}  # near-light travel causes subjective vs. objective time to diverge — distinct from time_loop/time_travel (The Forever War)
          - {id: mutual_human_alien_war, group: scifi_specific, spoiler: false}  # humans and aliens in symmetric expansionist conflict — distinct from alien_invasion, which implies a one-sided attack on human territory (Old Man's War)
          - {id: aging_reversal_or_rejuvenation, group: scifi_specific, spoiler: false}  # elderly protagonist restored to a younger, enhanced body (Old Man's War)
          - {id: satirical_or_comedic_scifi, group: scifi_specific, spoiler: false}  # sci-fi as vehicle for parody/satire of genre or bureaucratic conventions, not just humor_level's amount-of-comedy axis (Hitchhiker's Guide)
          - {id: uplift, group: scifi_specific, spoiler: false}  # a species deliberately or accidentally granted human-level intelligence via technology (Children of Time) — distinct from species_divergence, which covers humanity itself splitting into new species, not a different species being uplifted
          - {id: multiple_alien_species, group: scifi_specific, spoiler: false}  # added 2026-08-31 (external reader feedback, Empire of Silence): several distinct, established alien species/civilizations coexisting in the setting — sci-fi analog to multiple_fantasy_species. Distinct from mutual_human_alien_war (a specific conflict shape, not species-count) and uplift (one species elevated by humans, not multiple independently-evolved civilizations already present)
          - {id: predictive_social_science, group: scifi_specific, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep, migration 20260913170000): a non-mystical, explicitly scientific/mathematical model used to predict and deliberately steer a civilization's future over generations (Asimov's Foundation/Second Foundation/Foundation's Edge — Hari Seldon's psychohistory) — as opposed to fate, destiny, or supernatural foresight. Distinct from prophecy, which in this vocabulary consistently signals mystical/destined foresight; Foundation's own conceit is explicitly anti-mystical (a deterministic science of crowds, not fate), so a shared prophecy tag pulling in both genuinely conflates two different reader-facing signals — "chosen-one destiny" fantasy vs. "hard-SF civilization managed by a predictive model."
          - {id: incomprehensible_alien_contact, group: scifi_specific, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #3, migration 20260913230000): contact is made with an alien intelligence or phenomenon that remains fundamentally unknowable and uncommunicative despite genuine, sustained effort to understand it -- the narrative's actual point is the FAILURE of mutual comprehension itself, not a contact story where communication succeeds, fails due to hostility, or is merely delayed. Evidence: Solaris (decades of "Solaristics" fail to produce any genuine dialogue with the sentient ocean; its manifestations aren't communication, they're an unexplained byproduct) and Roadside Picnic (the aliens never appear or attempt contact, likely never even registering humanity's existence -- compared to travelers who stopped, littered, and left without noticing the ants nearby). Distinct from first_contact (a neutral tag for "aliens are encountered," true of most first-contact books regardless of outcome -- doesn't discriminate the subset where the entire point is permanent incomprehension), mutual_human_alien_war (implies active, comprehensible hostility/communication of intent, not blank incomprehension), and cosmic_horror (dread-toned; neither evidence book carries this tag -- Solaris/Roadside Picnic read as philosophical/melancholic rather than horror, a different emotional register on the same underlying "unknowability" theme).
          - {id: institutional_time_travel_bureaucracy, group: scifi_specific, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #3, migration 20260913230000): a formal agency/department administers time travel itself, via assigned handlers, permits, medical/security clearances, and monitoring protocols, foregrounding the mundane procedural apparatus as a load-bearing plot/thematic element rather than treating time travel as a personal power or one-off macguffin event. Evidence: The Ministry of Time (a covert British ministry recruits "expats" pulled from history, assigns each a "bridge" handler, runs medical evals/security vetting/protocol restrictions) and Doomsday Book (Oxford's History Faculty runs time travel through "the net," gated by safety authorizations, slippage calculations, quarantine procedures, and permission paperwork -- a well-known satire of academic-bureaucratic process). Distinct from time_travel (generic mechanism, says nothing about who administers it or how), dark_academia_setting (aesthetic/atmosphere, not the bureaucratic apparatus), and government_experimentation_on_the_gifted (coercive research on individuals with powers -- a different power dynamic than a routine, protocol-driven workplace administering travel as a program).

          # -- craft & narrative devices --
          - {id: twist_ending, group: craft_devices, spoiler: true}
          - {id: twist_filled, group: craft_devices, spoiler: true}  # multiple reversals throughout, not one ending twist — e.g. The Prestige, vs. twist_ending's Sixth Sense shape
          - {id: sanderlanche, group: craft_devices, spoiler: false}  # converging multi-thread payoff into an intense climax; community term, kept as-is (genre-native)
          - {id: redemption_arc, group: craft_devices, spoiler: true}
          - {id: villain_turns_ally, group: craft_devices, spoiler: true}
          - {id: major_character_death, group: craft_devices, spoiler: true}
          - {id: mentor_death, group: craft_devices, spoiler: true}
          - {id: mythological_retelling, group: craft_devices, spoiler: false}  # a known myth retold/reframed, usually from a different vantage point — a large, currently booming category (Circe, Song of Achilles) with no prior coverage
          - {id: shadow_self_confrontation, group: craft_devices, spoiler: false}  # protagonist must confront and integrate a literal or figurative dark half of themselves — distinct from redemption_arc, which requires prior villainy (A Wizard of Earthsea)
          - {id: corruption_arc, group: craft_devices, spoiler: true}  # a sympathetic or morally-grey protagonist's descent into villainy (The Ballad of Songbirds and Snakes) — the structural opposite of redemption_arc, which only covers the reverse direction
          - {id: mythological_pantheon_as_characters, group: craft_devices, spoiler: false}  # mythological/pantheon figures used as characters within an original, non-retold plot (American Gods) — distinct from mythological_retelling, which implies retelling one specific myth's actual events
          - {id: tragic_reversal_of_fortune, group: craft_devices, spoiler: true}  # a rise-then-tragic-fall arc, most often an enhancement or elevation that proves temporary or costly (Flowers for Algernon) — distinct from underdog_rising, which only covers the rise
          - {id: amnesia_driven_narrative, group: craft_devices, spoiler: false}  # protagonist memory loss/recovery is the structural engine revealing their own backstory to themselves (Project Hail Mary) — distinct from twist_ending/twist_filled, which are reader-facing reversals rather than a self-discovery device
          - {id: retrospective_memoir_narration, group: craft_devices, spoiler: false}  # added 2026-08-31 (external reader suggestion): the protagonist-narrator recounts their OWN past from a later vantage point, with explicit narrative distance between the narrating self and the experiencing self (The Name of the Wind — Kvothe telling his life story to the Chronicler). A specific, real reader-taste axis (the retrospective, "I know how this turns out" texture) distinct from `form: framing_device` in general, which is a broad structural umbrella also covering frames where the narrator ISN'T the protagonist recounting their own life (a third-party storyteller, a footnoted-historian voice, a found manuscript) — those don't carry the same narrative distance/foreshadowing texture this trope targets
          - {id: cosmic_horror, group: craft_devices, spoiler: false}  # added 2026-09-05 (catalog-wide gap sweep, migration 20260905140000): dread arising from vast, incomprehensible, uncaring cosmic forces/entities that human minds/morality cannot meaningfully confront or defeat (the Southern Reach trilogy's Area X, House of Leaves, The Call of Cthulhu, Mexican Gothic, Lovecraft Country) — the "confronting, not defeating" test is the key discriminator: a threat the protagonists ultimately out-fight or out-plan with ordinary human ingenuity doesn't qualify, which is exactly why the sweep deliberately EXCLUDED Perdido Street Station (the Slake Moths, however alien, are eventually defeated by human ingenuity). Distinct from ancient_evil_awakens (a discrete plot event, not a standing cosmology of incomprehensible scale) and body_horror (a content_warning about physical violation, not this field's epistemological dread).
          - {id: anthropomorphic_personification_protagonist, group: craft_devices, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep, migration 20260913170000): an abstract force or concept (Death, Time, Music) embodied as a literal character with human-like problems, relationships, and agency (Terry Pratchett's Death sub-series — Mort, Reaper Man, Hogfather, Soul Music). Distinct from mythological_pantheon_as_characters, which requires an actual named/worshipped mythology or religious system — Death predates and exists outside the Discworld's own gods, who appear separately. Also distinct from immortal_or_ageless_character, which just means "doesn't age/die" and says nothing about the concept-made-literal mechanism.
          - {id: creation_turns_on_creator, group: craft_devices, spoiler: false}  # added 2026-09-13 (catalog-wide gap sweep #2, migration 20260913220000): a creator's own artificial, reanimated, or engineered being -- the product of their hubris/god-playing -- ultimately turns against and causes the downfall of their maker, directly or indirectly (the "Frankenstein complex"). Evidence: Mary Shelley's Frankenstein (both editions -- the Creature systematically destroys everyone Victor loves and pursues him to his death) and H. G. Wells's The Island of Doctor Moreau (Moreau's vivisected Beast Folk ultimately kill him). Zero trope overlap between the two (Frankenstein: major_character_death, morally_grey_protagonist, revenge, shadow_self_confrontation; Moreau: dark_lord_or_evil_overlord, survivalist_ingenuity, uplift) despite sharing this exact mechanism. Distinct from ai_uprising_or_rebellion/android_or_replicant_rights (both evidence creations are biological, not AI/robotic), corruption_arc (a character's own internal moral decay, not an external creation's independent agency), villain_turns_ally (opposite direction), and shadow_self_confrontation (psychological self-confrontation -- already correctly tagged separately on Frankenstein, doesn't cover the literal external creature). Deliberately a distinct, GOTHIC/personal register from engineered_creation_escapes_control above (institutional/systemic disaster harming many, not necessarily the creator specifically) -- a reader who wants Frankenstein/Moreau's intimate creator-tragedy is not the same reader who wants Jurassic Park/Prey's ensemble techno-thriller, even though both share the broad "hubris punished by your own creation" theme.

  reader_fit:
    label: Reader fit
    scope: core
    fields:
      genre_accessibility:
        type: enum
        values: [gateway, accessible, moderate, demanding, veteran_only]
        # How much genre fluency/patience this book assumes of its
        # reader, independent of the craft fields above -- a book can
        # have simple prose (prose_complexity: accessible) and still
        # assume comfort with invented magic terminology, dense
        # political intrigue conventions, or a slow-burn multi-book
        # payoff; conversely a mainstream, culturally-familiar premise
        # (superheroes, a school setting) can make an otherwise
        # structurally demanding book land as more welcoming than its
        # other fields alone would suggest.
        #
        # Deliberately NOT part of the normal per-user weighted average
        # (see recommend.py's ORDINAL_FIELDS, which excludes it on
        # purpose) -- it powers a separate cold-start fallback instead,
        # for readers with too little demonstrated experience to trust a
        # normal profile match yet. Folding it into the main scoring
        # average would risk diluting real signal for readers who
        # already have a rating history, the same failure mode this
        # project already hit and fixed once for other fields.
        #
        # Backfilled for every already-tagged book via a formula over
        # prose_complexity, overall_pace, worldbuilding_density,
        # pov_count, and intellectual_weight (see its migration) -- a
        # real but INCOMPLETE proxy, since it can't capture premise
        # familiarity (nothing else does either). Going forward, a
        # tagger should start from that computed baseline and adjust it
        # specifically for premise-familiarity, not reassign from
        # scratch -- see tag-catalog-batch/SKILL.md.
        #
        # Related but distinct from the series-length-as-approachability
        # idea in the "Series & universe" note below -- that's about how
        # much TOTAL reading commitment a series represents (a long
        # ongoing series vs. a short completed one), independent of how
        # much genre fluency any single book in it assumes. Both are
        # real approachability axes; not conflated into one field.
        spoiler: false

# Series-level spoiler gating (not a schema field — a data-model note).
# Any field with spoiler: true, on a book that belongs to a series, gets a
# companion "reveals at installment N" value stored per book record, e.g.
# book_dna.ending_type_spoiler_horizon = 3. The UI hides the field until
# the reader's tracked progress reaches that installment, or they hit
# "reveal anyway." The recommendation engine always reads the true value
# regardless of horizon or reveal state.

# Series & universe (not a schema field — a data-model note for step 02).
# Membership in a series, and a series' completion status, are relational
# and mutable — they do NOT belong in book_dna as frozen tag data.
#   universe (optional)  — a shared continuity, e.g. "The First Law World"
#     └── series (optional) — a bounded arc within it, e.g. "The First Law"
#           status: ongoing | completed | hiatus  — refreshed from
#           metadata sources periodically, never set once at tagging time
#           book_count: how many books are in it (nullable/estimated
#           while ongoing — e.g. Stormlight's planned 10) — same reasoning
#           as status: a mutable, series-level fact, refreshed from
#           metadata, never frozen at tagging time. This is the "series
#           length" half of the length-as-approachability idea; the
#           per-book half is book_length above — they're independent
#           (few-but-huge volumes vs. many-but-normal-sized ones are both
#           "a lot of commitment," for different reasons).
#         └── book — position_in_series (nullable, may be fractional
#             for novellas/interquels)
#   A book can link to a universe directly without belonging to any one
#   series (e.g. Best Served Cold in the First Law world). Adding a later
#   sequel (The Shining -> Doctor Sleep) means adding a series row and
#   linking both books to it — it never requires re-tagging the earlier
#   book's own book_dna.narrative_closure, which stays whatever it always
#   was.

# Future fields backlog (deliberately not in v0.1 — revisit post-MVP):
#   - humor_flavor: witty_banter | slapstick | dark_comedy | satire | dry_wit
#     (style/flavor of humor, separate from humor_level's amount/frequency)
#   - tropes candidates deferred as too narrow for v1 (real terms, but
#     mostly matter to readers already deep in romantasy-specific
#     taxonomy rather than changing recommendations for a general SFF
#     reader — revisit if tagging real books shows they're needed):
#       touch_her_and_die, captive_or_captor_romance,
#       teacher_or_mentor_romance
#   - solarpunk (setting_worldbuilding) — flagged during trope research as
#     real but weaker/niche; not added
#   - content_warnings deferred as too marginal for v1 (real, weaker case
#     than what was added — revisit if tagging shows they're needed):
#       religious_bigotry (distinct from religious_trauma_or_cults —
#         persecution FOR faith vs. harm FROM a religion/cult),
#       physical_abuse non-domestic (risks real overlap with
#         domestic_abuse + child_abuse combined),
#       forced_institutionalization (niche)
#   - cannibalism (content_warnings) — considered during the 30-book
#     pilot (The Road), REJECTED on reflection: unlike the researched
#     content_warnings additions (cross-checked against StoryGraph/real
#     book lists), this was only a single in-the-moment inference while
#     tagging, and on the same "does this change the recommendation, not
#     just is it upsetting" test used throughout, it reads as a specific
#     flavor of body_horror + violence_intensity:graphic rather than a
#     distinct category — same reasoning that excluded gore/blood/injury
#     earlier. Not added.
